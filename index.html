<script type="module">
/* ======================================================================
   월간 기도나무 v2
   - 빌드 없이 바로 실행 (Preact + htm, 약 13KB)
   - 데이터: Firebase Firestore
       prayers    : 기도제목 (기존 데이터 그대로 사용)
       gratitude  : 감사일기
       photos     : 감사사진 (작은 미리보기)
       photo_full : 감사사진 (원본 크기, 눌렀을 때만 불러옴)
   - 주소 뒤에 ?demo 를 붙이면 실제 데이터 대신 이 기기에만 저장되는 체험 모드로 열려요.
====================================================================== */
import { html, render, useState, useEffect, useMemo, useRef } from "https://unpkg.com/htm@3.1.1/preact/standalone.module.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVtSTVaeF98c5P2J_fDY5BeLOMpTkRGlg",
  authDomain: "prayer-tree-b4553.firebaseapp.com",
  projectId: "prayer-tree-b4553",
  storageBucket: "prayer-tree-b4553.firebasestorage.app",
  messagingSenderId: "250561450400",
  appId: "1:250561450400:web:0fbcb4ad53fd1c2ecb54c5"
};

const DEMO = new URLSearchParams(location.search).has("demo");
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const AVATAR = ["#3f6b52","#557d5f","#6f8f66","#2f5a44","#8a6d3b","#a1524f","#5b7a8c","#7a5c8c","#4f7c74"];
const LEAF = ["#2f5a44","#3f6b52","#557d5f","#6f8f66","#7fa383"];

/* ---------- 작은 도구들 ---------- */
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowIso = () => new Date().toISOString();
const ym = (s) => { const [y, m] = String(s).split("-").map(Number); return { y, m: m - 1 }; };
const newId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
const hashOf = (str) => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; };
const sortDesc = (a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || "");
const fmtDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); const w = "일월화수목금토"[new Date(y, m - 1, d).getDay()]; return `${m}월 ${d}일 (${w})`; };
const avatarText = (n = "") => (n.length >= 3 ? n.slice(-2) : n) || "?";
const itemsOf = (kind, e) => (kind === "prayer" ? e.prayers : e.items) || [];

/* ---------- 데이터 연결 ---------- */
async function makeFirebaseApi() {
  const A = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
  const db = F.getFirestore(A.initializeApp(firebaseConfig));
  return {
    watch(coll, cb, onErr, lim) {
      const ref = F.collection(db, coll);
      const q = lim ? F.query(ref, F.orderBy("createdAt", "desc"), F.limit(lim)) : ref;
      return F.onSnapshot(q, (s) => cb(s.docs.map((d) => d.data())), onErr);
    },
    save: (coll, obj) => F.setDoc(F.doc(db, coll, obj.id), obj),
    remove: (coll, id) => F.deleteDoc(F.doc(db, coll, id)),
    async get(coll, id) { const s = await F.getDoc(F.doc(db, coll, id)); return s.exists() ? s.data() : null; },
  };
}

function makeDemoApi() {
  const KEY = "pt-demo-v2";
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { db = null; }
  if (!db) db = seedDemo();
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn("demo storage full"); } };
  persist();
  const emit = () => { persist(); subs.forEach((s) => s()); };
  return {
    watch(coll, cb, onErr, lim) {
      const fire = () => {
        let arr = Object.values(db[coll] || {});
        if (lim) arr = arr.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, lim);
        cb(arr.map((x) => ({ ...x })));
      };
      subs.add(fire); setTimeout(fire, 120);
      return () => subs.delete(fire);
    },
    async save(coll, obj) { (db[coll] = db[coll] || {})[obj.id] = JSON.parse(JSON.stringify(obj)); emit(); },
    async remove(coll, id) { if (db[coll]) delete db[coll][id]; emit(); },
    async get(coll, id) { return (db[coll] || {})[id] || null; },
  };
}

function seedDemo() {
  const y = new Date().getFullYear(), cm = new Date().getMonth();
  const names = ["김은혜", "박소망", "이믿음", "최사랑", "정기쁨", "한평안"];
  const P = ["가족 모두 건강하게 지낼 수 있도록", "새로 맡은 일에 지혜를 주시도록", "이직 준비가 잘 되도록", "매일 말씀 묵상을 놓치지 않도록",
    "부모님 수술이 잘 끝나도록", "아이가 새 학교에 잘 적응하도록", "마음의 평안을 지킬 수 있도록", "동기 모임이 계속 이어지도록"];
  const T = ["오늘 아침 햇살이 따뜻해서 감사", "친구가 안부를 물어줘서 감사", "맛있는 저녁을 가족과 함께 먹어서 감사", "일이 생각보다 빨리 끝나서 감사", "건강검진 결과가 좋아서 감사"];
  const db = { prayers: {}, gratitude: {}, photos: {}, photo_full: {} };
  let k = 0;
  for (let m = Math.max(0, cm - 3); m <= cm; m++) {
    names.forEach((n, i) => {
      if ((i + m) % 3 === 0 && m !== cm) return;
      const id = `demo-p-${k++}`, cnt = 2 + ((i + m) % 3);
      const prayers = Array.from({ length: cnt }, (_, j) => P[(i * 3 + j + m) % P.length]);
      const day = (d) => pad(m === cm ? Math.min(d, new Date().getDate()) : d);
      db.prayers[id] = { id, name: n, date: `${y}-${pad(m + 1)}-${day(3 + i * 3)}`, prayers, answered: prayers.map((_, j) => (i + j + m) % 5 === 0), createdAt: nowIso() };
      if ((i + m) % 2 === 0) {
        const gid = `demo-g-${k++}`;
        db.gratitude[gid] = { id: gid, name: n, date: `${y}-${pad(m + 1)}-${day(5 + i * 3)}`, items: [T[(i + m) % T.length], T[(i + m + 2) % T.length]], createdAt: nowIso() };
      }
    });
  }
  return db;
}

/* 감사일기 글을 읽고 주제를 찾아 말씀 2구절을 고른다 */
function pickVerses(texts, seed) {
  const t = texts.join(" ");
  const found = THEMES.map((th) => ({ th, s: th.kw.reduce((n, k) => n + (t.split(k).length - 1), 0) }))
    .filter((x) => x.s > 0).sort((a, b) => b.s - a.s).map((x) => x.th);
  const pool = found.slice(0, 2);
  while (pool.length < 2) pool.push(JOY);
  const h = hashOf(seed), picked = [];
  pool.forEach((th, i) => {
    const refs = th.refs.filter((r) => !picked.some((p) => p.ref === r));
    const ref = refs[(h >>> (i * 5)) % refs.length];
    picked.push({ ref, text: VERSES[ref] });
  });
  return { tags: found.slice(0, 3).map((x) => x.tag), verses: picked };
}

function VerseBox({ texts, seed, title, sub, small }) {
  const r = useMemo(() => pickVerses(texts, seed), [texts.join("|"), seed]);
  return html`<section class=${"verse" + (small ? " small" : "")}>
    <div class="verse-h"><b>📖 ${title}</b>${sub && html`<small>${sub}</small>`}</div>
    ${r.tags.length > 0 && html`<div class="tags">${r.tags.map((t) => html`<span>#${t}</span>`)}</div>`}
    ${r.verses.map((v) => html`<blockquote><p>${v.text}</p><cite>${refName(v.ref)} · 개역개정</cite></blockquote>`)}
  </section>`;
}

/* ---------- 사진 줄이기 (휴대폰 사진 → 작은 JPG) ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("이미지를 읽을 수 없어요"));
    img.src = url;
  });
}
function shrink(img, max, q) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", q), w: c.width, h: c.height };
}
async function processPhoto(file) {
  const img = await loadImage(file);
  let full;
  for (const [m, q] of [[1600, 0.82], [1280, 0.78], [1080, 0.72], [900, 0.65], [720, 0.6]]) {
    full = shrink(img, m, q);
    if (full.data.length < 850000) break; // Firestore 문서 1MB 제한 안쪽으로
  }
  const thumb = shrink(img, 420, 0.72);
  return { full, thumb };
}

  const [scope, setScope] = useState("month");
  const [who, setWho] = useState("");
  const [photoLimit, setPhotoLimit] = useState(30);
  const P = useColl("prayers");
  const G = useColl("gratitude");
  const PH = useColl("photos", photoLimit);
  const [sheet, setSheet] = useState(null);       // { type, entry }
  const [confirm, setConfirm] = useState(null);   // { title, body, onOk }
  const [lightId, setLightId] = useState(null);
  const [toast, setToast] = useState("");
  const [freshId, setFreshId] = useState(null);
  const toastTimer = useRef(null);

  const say = (msg) => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(""), 2300); };
  const go = (t) => { setTab(t); localStorage.setItem("pt-tab", t); window.scrollTo(0, 0); };

  useEffect(() => { document.body.style.overflow = sheet || confirm || lightId ? "hidden" : ""; }, [sheet, confirm, lightId]);

  const names = useMemo(() => {
    const s = new Set();
    [...P.items, ...G.items, ...PH.items].forEach((e) => e.name && s.add(e.name));
    return [...s].sort((a, b) => a.localeCompare(b, "ko"));
  }, [P.items, G.items, PH.items]);

  const COLL = { prayer: "prayers", thanks: "gratitude" };
  const LABEL = { prayer: "기도제목", thanks: "감사일기", photo: "사진" };

  function askDelete(kind, e) {
    setConfirm({
      title: "정말 삭제할까요?",
      body: `${e.name}님의 ${LABEL[kind]}${kind === "thanks" ? "가" : "이"} 삭제돼요. 삭제하면 되돌릴 수 없어요.`,
      onOk: async () => {
        try {
          if (kind === "photo") { await api.remove("photos", e.id); await api.remove("photo_full", e.id); setLightId(null); }
          else await api.remove(COLL[kind], e.id);
          say("삭제했어요");
        } catch (err) { console.error(err); say("삭제에 실패했어요. 다시 시도해 주세요"); }
      },
    });
  }

  async function toggleAnswered(e, i) {
    const ans = (e.prayers || []).map((_, j) => !!(e.answered || [])[j]);
    ans[i] = !ans[i];
    try {
      await api.save("prayers", { ...e, answered: ans, updatedAt: nowIso() });
      if (ans[i]) say("기도 응답 감사해요! 나무에 열매가 맺혔어요");
    } catch (err) { console.error(err); say("저장에 실패했어요"); }
  }

  function afterSave(kind, date, msg, id) {
    if (kind === "thanks") setFreshId(id);
    const d = ym(date);
    setYear(d.y); setMonth(d.m); setScope("month");
    if (kind !== tab) go(kind);
    setSheet(null); say(msg);
  }

  const fab = { tree: ["prayer", "기도제목 쓰기"], prayer: ["prayer", "기도제목 쓰기"], thanks: ["thanks", "감사일기 쓰기"], photo: ["photo", "사진 올리기"] }[tab];
  const light = lightId ? PH.items.find((p) => p.id === lightId) : null;
  const listProps = { year, month, setMonth, scope, setScope, who, setWho, names, freshId,
    onEdit: (kind, e) => setSheet({ type: kind, entry: e }), onDelete: askDelete, onToggle: toggleAnswered };

  return html`
    <div class="app">
      ${DEMO && html`<div class="demo-badge">체험 모드 · 이 기기에만 저장되고 동기들에게는 보이지 않아요</div>`}
      <header class="topbar">
        <div class="brand">🌿 월간 기도나무 <small>95년 동기</small></div>
        ${tab !== "photo" && html`
          <div class="yearsw">
            <button aria-label="이전 해" onClick=${() => setYear((y) => y - 1)}>‹</button>
            <span>${year}년</span>
            <button aria-label="다음 해" onClick=${() => setYear((y) => y + 1)}>›</button>
          </div>`}
      </header>

      ${tab === "tree" && html`<${TreeTab} P=${P} G=${G} year=${year} who=${who} setWho=${setWho} names=${names}
          onPick=${(m) => { setMonth(m); setScope("month"); go("prayer"); }} />`}
      ${tab === "prayer" && html`<${ListTab} kind="prayer" data=${P} ...${listProps} />`}
      ${tab === "thanks" && html`<${ListTab} kind="thanks" data=${G} ...${listProps} />`}
      ${tab === "photo" && html`<${PhotoTab} data=${PH} who=${who} setWho=${setWho} names=${names} limit=${photoLimit}
          onMore=${() => setPhotoLimit((n) => n + 30)} onOpen=${(p) => setLightId(p.id)} />`}

      <button class="fab" onClick=${() => setSheet({ type: fab[0], entry: null })}>＋ ${fab[1]}</button>

      <nav class="nav"><div class="nav-in">
        ${TABS.map((t) => html`
          <button class=${tab === t.id ? "on" : ""} onClick=${() => go(t.id)} aria-current=${tab === t.id ? "page" : undefined}>
            ${t.icon}<span>${t.label}</span>
          </button>`)}
      </div></nav>

      ${sheet && (sheet.type === "photo"
        ? html`<${PhotoForm} entry=${sheet.entry} names=${names} onClose=${() => setSheet(null)}
              onDone=${(msg) => { setSheet(null); go("photo"); say(msg); }} />`
        : html`<${EntryForm} kind=${sheet.type} entry=${sheet.entry} names=${names} onClose=${() => setSheet(null)}
              onSaved=${(date, msg, id) => afterSave(sheet.type, date, msg, id)} />`)}

      ${light && html`<${Lightbox} p=${light} onClose=${() => setLightId(null)}
          onEdit=${() => setSheet({ type: "photo", entry: light })} onDelete=${() => askDelete("photo", light)} />`}

      ${confirm && html`<${Confirm} c=${confirm} onClose=${() => setConfirm(null)} />`}
      ${toast && html`<div class="toast" role="status">${toast}</div>`}
    </div>`;
}

/* ---------- 기도나무 탭 ---------- */
function TreeTab({ P, G, year, who, setWho, names, onPick }) {
  const inYear = (e) => e.date && ym(e.date).y === year;
  const py = P.items.filter(inYear), gy = G.items.filter(inYear);
  const mine = (e) => !who || e.name === who;
  const topics = py.filter(mine).reduce((s, e) => s + (e.prayers || []).length, 0);
  const answered = py.filter(mine).reduce((s, e) => s + (e.answered || []).filter(Boolean).length, 0);
  const thanks = gy.filter(mine).length;
  const allTopics = P.items.reduce((s, e) => s + (e.prayers || []).length, 0);

  return html`
    <section class="hero">
      네 짐을 여호와께 맡기라 그가 너를 붙드시고<br />의인의 요동함을 영원히 허락하지 아니하시리로다
      <cite>시편 55:22</cite>
    </section>
    <div class="wrap">
      <select class="select" value=${who} onChange=${(e) => setWho(e.target.value)} aria-label="이름으로 보기">
        <option value="">모든 동기의 나무 보기</option>
        ${names.map((n) => html`<option value=${n}>${n}님 기도만 보기</option>`)}
      </select>
      <div class="stats">
        <div class="stat"><b>${topics}</b><span>🍃 기도제목</span></div>
        <div class="stat"><b>${answered}</b><span>🍎 응답</span></div>
        <div class="stat"><b>${thanks}</b><span>🌼 감사일기</span></div>
      </div>
      <div class="tree-card">
        ${P.status === "loading"
          ? html`<div class="empty"><span class="big">🌱</span>나무를 키우는 중…</div>`
          : html`<${TreeSvg} prayers=${py} thanks=${G.status === "ready" ? gy : []} who=${who} onPick=${onPick} />`}
        <div class="legend"><span>🍃 기도제목</span><span>🌼 감사일기</span><span>🍎 응답된 기도</span></div>
        <p class="hint">가지(달 이름)를 누르면 그 달 기도제목으로 이동해요</p>
      </div>
      <p class="total-line">지금까지 함께 쌓은 기도제목 <b>${allTopics}개</b> · 감사일기 <b>${G.items.length}개</b></p>
      ${P.status === "error" && html`<div class="notice">데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`}
    </div>`;
}

function TreeSvg({ prayers, thanks, who, onPick }) {
  const cx = 200, cy = 205, rx = 152, ry = 142;
  const branches = useMemo(() => MONTHS.map((name, i) => {
    const a = ((200 - i * 20) * Math.PI) / 180;
    const T = { x: cx + rx * Math.cos(a), y: cy - ry * Math.sin(a) };
    const side = Math.abs(Math.cos(a)) < 0.2 ? 0 : Math.sign(Math.cos(a));
    const S = { x: 200 + side * 4, y: Math.min(330, Math.max(196, 196 + ((T.y - 63) / (254 - 63)) * 134)) };
    const C = { x: S.x + (T.x - S.x) * 0.3, y: T.y + (S.y - T.y) * 0.18 };
    const len = Math.hypot(T.x - cx, T.y - cy) || 1;
    const L = { x: T.x + ((T.x - cx) / len) * 20, y: T.y + ((T.y - cy) / len) * 18 + 4 };
    return { i, name, S, C, T, L };
  }), []);

  const bez = (b, t) => ({
    x: (1 - t) * (1 - t) * b.S.x + 2 * (1 - t) * t * b.C.x + t * t * b.T.x,
    y: (1 - t) * (1 - t) * b.S.y + 2 * (1 - t) * t * b.C.y + t * t * b.T.y,
  });
  const spot = (b, seed, n, tMin = 0.45) => {
    const h = hashOf(seed), t = tMin + ((h % 1000) / 1000) * (1.12 - tMin);
    const p = bez(b, Math.min(t, 1)), ext = Math.max(0, t - 1);
    const ang = ((h >> 5) % 360) * (Math.PI / 180), dist = 4 + (((h >> 11) % 100) / 100) * (14 + Math.sqrt(n) * 3.5);
    return { x: p.x + Math.cos(ang) * dist + (b.T.x - cx) * ext * 0.3, y: p.y + Math.sin(ang) * dist * 0.85 + (b.T.y - cy) * ext * 0.3, h };
  };

  const byMonth = (arr) => { const g = Array.from({ length: 12 }, () => []); arr.forEach((e) => g[ym(e.date).m].push(e)); return g; };
  const pm = useMemo(() => byMonth(prayers), [prayers]);
  const gm = useMemo(() => byMonth(thanks), [thanks]);
  const dim = (e) => (who && e.name !== who ? 0.13 : 1);

  return html`
    <svg viewBox="0 0 400 415" role="img" aria-label="월별 기도나무">
      <defs>
        <linearGradient id="bark" x1="0" x2="1"><stop offset="0" stop-color="#4a3626" /><stop offset=".5" stop-color="#6b4f37" /><stop offset="1" stop-color="#3e2c1f" /></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#cfe0c6" stop-opacity=".7" /><stop offset="1" stop-color="#cfe0c6" stop-opacity="0" /></radialGradient>
      </defs>
      <ellipse cx="200" cy="200" rx="195" ry="175" fill="url(#glow)" />
      <g fill="#9fbf98" opacity=".16">
        <circle cx="200" cy="150" r="95" /><circle cx="110" cy="205" r="75" /><circle cx="290" cy="205" r="75" />
        <circle cx="140" cy="120" r="60" /><circle cx="260" cy="120" r="60" /><circle cx="200" cy="250" r="70" />
      </g>
      <ellipse cx="200" cy="404" rx="150" ry="9" fill="#dfe6d3" />
      <path d="M182,406 C188,380 191,355 193,325 L196,192 L204,192 L207,325 C209,355 212,380 218,406 Z" fill="url(#bark)" />
      <path d="M186,404 C170,406 160,402 150,406 M214,404 C230,406 240,402 252,406" stroke="#5a412d" stroke-width="4" stroke-linecap="round" fill="none" />
      ${branches.map((b) => {
        const has = pm[b.i].length + gm[b.i].length > 0;
        return html`<path d=${`M${b.S.x},${b.S.y} Q${b.C.x},${b.C.y} ${b.T.x},${b.T.y}`} fill="none" stroke=${has ? "#5a412d" : "#b3a68e"}
          stroke-width=${has ? 5 : 2} stroke-linecap="round" stroke-dasharray=${has ? null : "3 5"} />`;
      })}
      ${branches.map((b) => {
        const n = pm[b.i].reduce((s, e) => s + (e.prayers || []).length, 0);
        return pm[b.i].map((e) => (e.prayers || []).map((_, k) => {
          const s = spot(b, e.id + "p" + k, n, 0.3);
          const sc = 1.55 + ((s.h >> 3) % 60) / 100;
          return html`<path d="M0,0 C-5,-4 -5.5,-10 0,-15 C5.5,-10 5,-4 0,0 Z" transform=${`translate(${s.x.toFixed(1)},${s.y.toFixed(1)}) rotate(${s.h % 360}) scale(${sc.toFixed(2)})`}
            fill=${LEAF[s.h % LEAF.length]} opacity=${0.9 * dim(e)} stroke=${who && e.name === who ? "#fff" : "none"} stroke-width="0.8" />`;
        }));
      })}
      ${branches.map((b) => gm[b.i].map((e) => {
        const s = spot(b, e.id + "g", gm[b.i].length + pm[b.i].length, 0.6);
        return html`<g transform=${`translate(${s.x.toFixed(1)},${s.y.toFixed(1)})`} opacity=${dim(e)}>
          ${[0, 72, 144, 216, 288].map((d) => html`<circle cx=${(Math.cos((d * Math.PI) / 180) * 4).toFixed(2)} cy=${(Math.sin((d * Math.PI) / 180) * 4).toFixed(2)} r="3.3" fill="#fff6d8" stroke="#e9c766" stroke-width=".7" />`)}
          <circle r="2.4" fill="#e0a43a" />
        </g>`;
      }))}
      ${branches.map((b) => pm[b.i].map((e) => (e.answered || []).map((on, k) => {
        if (!on) return null;
        const s = spot(b, e.id + "a" + k, pm[b.i].length, 0.55);
        return html`<g opacity=${dim(e)}><circle cx=${s.x.toFixed(1)} cy=${s.y.toFixed(1)} r="5.2" fill="#c2453f" stroke="#8e2a26" stroke-width=".6" />
          <circle cx=${(s.x - 1.6).toFixed(1)} cy=${(s.y - 1.7).toFixed(1)} r="1.5" fill="#fff" opacity=".7" /></g>`;
      })))}
      ${branches.map((b) => {
        const n = (who ? pm[b.i].filter((e) => e.name === who) : pm[b.i]).length;
        return html`<g onClick=${() => onPick(b.i)} style="cursor:pointer">
          <circle cx=${b.T.x} cy=${b.T.y} r="26" fill="transparent" />
          <rect x=${b.L.x - (n ? 24 : 15)} y=${b.L.y - 11} width=${n ? 48 : 30} height="19" rx="9.5" fill="#fff" stroke="#e6ddc4" opacity=".95" />
          <text x=${b.L.x} y=${b.L.y + 3} text-anchor="middle" font-size="11" font-weight="700" fill=${n ? "#2f5a44" : "#a6ad9f"} font-family="Noto Sans KR, sans-serif">
            ${b.name}${n ? ` ${n}` : ""}
          </text>
        </g>`;
      })}
    </svg>`;
}

/* ---------- 기도제목 / 감사일기 목록 탭 ---------- */
function ListTab({ kind, data, year, month, setMonth, scope, setScope, who, setWho, names, freshId, onEdit, onDelete, onToggle }) {
  const isP = kind === "prayer";
  const unit = isP ? "기도제목" : "감사";
  const base = useMemo(() => data.items.filter((e) => e.date && (!who || e.name === who)), [data.items, who]);
  const counts = useMemo(() => {
    const c = Array(12).fill(0);
    base.forEach((e) => { const d = ym(e.date); if (d.y === year) c[d.m]++; });
    return c;
  }, [base, year]);
  const list = useMemo(() => base.filter((e) => {
    const d = ym(e.date);
    return scope === "all" ? true : scope === "year" ? d.y === year : d.y === year && d.m === month;
  }).sort(sortDesc), [base, scope, year, month]);
  const groups = useMemo(() => {
    const out = [];
    list.forEach((e) => {
      const d = ym(e.date), key = `${d.y}-${d.m}`;
      if (!out.length || out[out.length - 1].key !== key) out.push({ key, label: `${scope === "all" ? d.y + "년 " : ""}${MONTHS[d.m]}`, items: [] });
      out[out.length - 1].items.push(e);
    });
    return out;
  }, [list, scope]);
  const chipsRef = useRef(null);
  useEffect(() => {
    const box = chipsRef.current, on = box && box.querySelector(".chip.on");
    if (on) box.scrollTo({ left: on.offsetLeft - box.clientWidth / 2 + on.clientWidth / 2, behavior: "smooth" });
  }, [month, scope, kind]);
  const people = new Set(list.map((e) => e.name)).size;
  const total = list.reduce((s, e) => s + itemsOf(kind, e).length, 0);

  if (data.status === "denied") return html`<div class="wrap"><div class="notice">
    ${isP ? "기도제목" : "감사일기"} 저장 공간이 아직 열려 있지 않아요.<br />관리자가 Firebase 보안 규칙에 <b>${isP ? "prayers" : "gratitude"}</b> 항목을 추가하면 바로 쓸 수 있어요.</div></div>`;

  // 오늘의 말씀: 오늘 감사일기(없으면 가장 최근 날짜의 감사일기)를 읽고 고른다
  const today = todayStr();
  const latest = base.length ? base.slice().sort(sortDesc)[0].date : null;
  const vDate = base.some((e) => e.date === today) ? today : latest;
  const vTexts = base.filter((e) => e.date === vDate).flatMap((e) => e.items || []);
  const vSub = !vDate ? "감사일기를 쓰면 맞춤 말씀을 골라드려요"
    : vDate === today ? `오늘 감사일기 ${base.filter((e) => e.date === today).length}개를 읽고 골랐어요`
    : `최근 감사일기(${fmtDate(vDate)})를 읽고 골랐어요`;

  const card = (e) => html`<${EntryCard} key=${e.id} kind=${kind} e=${e} fresh=${e.id === freshId} onEdit=${() => onEdit(kind, e)} onDelete=${() => onDelete(kind, e)} onToggle=${(i) => onToggle(e, i)} />`;

  return html`<div class="wrap">
    ${!isP && data.status === "ready" && html`<${VerseBox} title="오늘의 말씀" sub=${vSub} texts=${vTexts} seed=${today + (who || "all")} />`}
    <div class="seg" role="tablist">
      ${[["month", "월별"], ["year", `${year}년 누적`], ["all", "전체 누적"]].map(([v, l]) => html`
        <button class=${scope === v ? "on" : ""} onClick=${() => setScope(v)}>${l}</button>`)}
    </div>
    ${scope === "month" && html`<div class="chips" ref=${chipsRef}>
      ${MONTHS.map((m, i) => html`<button class=${"chip" + (i === month ? " on" : counts[i] ? "" : " zero")} onClick=${() => setMonth(i)}>
        ${m}${counts[i] > 0 && html`<i>${counts[i]}</i>`}</button>`)}
    </div>`}
    <select class="select" value=${who} onChange=${(e) => setWho(e.target.value)} aria-label="이름으로 보기">
      <option value="">모든 동기</option>
      ${names.map((n) => html`<option value=${n}>${n}</option>`)}
    </select>
    ${data.status === "loading" && html`<div class="empty"><span class="big">🌱</span>불러오는 중…</div>`}
    ${data.status === "error" && html`<div class="notice">데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`}
    ${data.status === "ready" && (list.length === 0
      ? html`<div class="empty"><span class="big">${isP ? "🍃" : "🌼"}</span>
          ${who ? `${who}님의 ` : ""}${scope === "month" ? `${year}년 ${MONTHS[month]}에는` : "아직"} ${isP ? "심어진 기도제목이" : "적힌 감사일기가"} 없어요.<br />
          아래 <b>＋ ${isP ? "기도제목" : "감사일기"} 쓰기</b>를 눌러 시작해 보세요.</div>`
      : html`
        <p class="summary">${people}명 · ${unit} <b>${total}개</b>${isP ? html` · 응답 <b>${list.reduce((s, e) => s + (e.answered || []).filter(Boolean).length, 0)}개</b>` : ""}</p>
        ${scope === "month" ? list.map(card) : groups.map((g) => html`
          <h3 class="month-h">${g.label} <small>· ${g.items.length}건</small></h3>
          ${g.items.map(card)}`)}`)}
  </div>`;
}

function EntryCard({ kind, e, fresh, onEdit, onDelete, onToggle }) {
  const isP = kind === "prayer";
  const [open, setOpen] = useState(!!fresh);
  const cardRef = useRef(null);
  useEffect(() => {
    if (!fresh) return;
    setOpen(true);
    setTimeout(() => cardRef.current && cardRef.current.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
  }, [fresh]);
  const items = itemsOf(kind, e);
  return html`<article ref=${cardRef} class=${"card" + (isP ? "" : " thanks")}>
    <div class="card-h">
      <div class="avatar" style=${{ background: AVATAR[hashOf(e.name || "") % AVATAR.length] }}>${avatarText(e.name)}</div>
      <div class="who"><b>${e.name}</b><span>${fmtDate(e.date)}</span></div>
      <button class="mini" onClick=${onEdit}>수정</button>
      <button class="mini del" onClick=${onDelete}>삭제</button>
    </div>
    <ul class="plist">
      ${items.map((t, i) => {
        const done = isP && (e.answered || [])[i];
        return html`<li class=${done ? "done" : ""}>
          <span class="num">${isP ? i + 1 : "♡"}</span>
          <span class="txt">${t}</span>
          ${isP && html`<button class=${"ans" + (done ? " on" : "")} onClick=${() => onToggle(i)} aria-pressed=${!!done}>
            ${done ? "🍎 응답됨" : "응답?"}</button>`}
        </li>`;
      })}
    </ul>
    ${!isP && html`
      <button class="verse-btn" onClick=${() => setOpen(!open)} aria-expanded=${open}>📖 이 감사에 어울리는 말씀 ${open ? "접기 ▴" : "보기 ▾"}</button>
      ${open && html`<${VerseBox} small title="말씀 선물" sub=${`${e.name}님의 감사일기를 읽고 골랐어요`} texts=${items} seed=${e.id} />`}`}
  </article>`;
}

/* ---------- 기도제목 / 감사일기 쓰기 ---------- */
function EntryForm({ kind, entry, names, onClose, onSaved }) {
  const isP = kind === "prayer";
  const [date, setDate] = useState(entry ? entry.date : todayStr());
  const [name, setName] = useState(entry ? entry.name : localStorage.getItem("pt-name") || "");
  const [items, setItems] = useState(entry ? [...itemsOf(kind, entry)] : ["", "", ""]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const setAt = (i, v) => setItems(items.map((x, j) => (j === i ? v : x)));

  async function submit() {
    const clean = items.map((t) => t.trim()).filter(Boolean);
    if (!name.trim()) return setErr("이름을 입력해 주세요.");
    if (!clean.length) return setErr(`${isP ? "기도제목" : "감사한 일"}을 하나 이상 적어 주세요.`);
    if (!date) return setErr("날짜를 골라 주세요.");
    setBusy(true); setErr("");
    const t = nowIso();
    const common = { id: entry ? entry.id : newId(), date, name: name.trim(), createdAt: (entry && entry.createdAt) || t, updatedAt: t };
    let obj;
    if (isP) {
      const old = entry ? entry.prayers || [] : [], oldAns = entry ? entry.answered || [] : [];
      obj = { ...common, prayers: clean, answered: clean.map((p) => { const k = old.indexOf(p); return k >= 0 ? !!oldAns[k] : false; }) };
    } else {
      obj = { ...common, items: clean };
    }
    try {
      await api.save(isP ? "prayers" : "gratitude", obj);
      localStorage.setItem("pt-name", obj.name);
      onSaved(date, entry ? "수정했어요" : isP ? "기도나무에 잎이 돋았어요 🍃" : "감사일기를 남겼어요. 말씀을 확인해 보세요 🌼", obj.id);
    } catch (e) {
      console.error(e);
      setErr(e && e.code === "permission-denied" ? "저장 권한이 없어요. 관리자에게 Firebase 규칙 확인을 부탁해 주세요." : "저장에 실패했어요. 인터넷 연결을 확인해 주세요.");
      setBusy(false);
    }
  }

  return html`<div class="overlay">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grip"></div>
      <div class="sheet-h">
        <h3>${entry ? `${isP ? "기도제목" : "감사일기"} 수정` : isP ? "기도제목 쓰기" : "오늘의 감사일기"}</h3>
        <button class="xbtn" onClick=${onClose} aria-label="닫기">✕</button>
      </div>
      ${entry && html`<div class="editing">✎ ${entry.name}님의 ${isP ? "기도제목을" : "감사일기를"} 수정하는 중이에요</div>`}
      <div class="row2">
        <div class="field"><label>이름</label>
          <input value=${name} onInput=${(e) => setName(e.target.value)} placeholder="이름" list="pt-names" autocomplete="off" />
          <datalist id="pt-names">${names.map((n) => html`<option value=${n} />`)}</datalist>
        </div>
        <div class="field"><label>날짜</label>
          <input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} />
        </div>
      </div>
      <div class="field">
        <label>${isP ? "기도제목" : "감사한 일"}</label>
        ${items.map((v, i) => html`<div class="item-row">
          <span class="num">${isP ? i + 1 : "♡"}</span>
          <textarea rows="2" value=${v} onInput=${(e) => setAt(i, e.target.value)}
            placeholder=${isP ? (i === 0 ? "기도제목을 적어주세요" : "기도제목 (선택)") : i === 0 ? "오늘 감사했던 일을 적어주세요" : "감사한 일 (선택)"}></textarea>
          ${items.length > 1 && html`<button class="rm" onClick=${() => setItems(items.filter((_, j) => j !== i))} aria-label="이 줄 지우기">✕</button>`}
        </div>`)}
      </div>
      <button class="addline" onClick=${() => setItems([...items, ""])}>＋ ${isP ? "기도제목" : "감사한 일"} 한 줄 더</button>
      ${err && html`<p class="err">${err}</p>`}
      <button class="primary" onClick=${submit} disabled=${busy}>
        ${busy ? "저장 중…" : entry ? "수정 완료" : isP ? "기도나무에 새기기" : "감사일기 남기기"}
      </button>
    </div>
  </div>`;
}

/* ---------- 감사사진 탭 ---------- */
function PhotoTab({ data, who, setWho, names, limit, onMore, onOpen }) {
  const list = useMemo(() => data.items.filter((p) => !who || p.name === who).sort(sortDesc), [data.items, who]);
  const groups = useMemo(() => {
    const out = [];
    list.forEach((p) => {
      const d = ym(p.date), key = `${d.y}-${d.m}`;
      if (!out.length || out[out.length - 1].key !== key) out.push({ key, label: `${d.y}년 ${MONTHS[d.m]}`, items: [] });
      out[out.length - 1].items.push(p);
    });
    return out;
  }, [list]);

  if (data.status === "denied") return html`<div class="wrap"><div class="notice">
    감사사진 저장 공간이 아직 열려 있지 않아요.<br />관리자가 Firebase 보안 규칙에 <b>photos</b>, <b>photo_full</b> 항목을 추가하면 바로 쓸 수 있어요.</div></div>`;

  return html`<div class="wrap">
    <select class="select" value=${who} onChange=${(e) => setWho(e.target.value)} aria-label="이름으로 보기">
      <option value="">모든 동기의 사진</option>
      ${names.map((n) => html`<option value=${n}>${n}</option>`)}
    </select>
    ${data.status === "loading" && html`<div class="empty"><span class="big">📷</span>불러오는 중…</div>`}
    ${data.status === "error" && html`<div class="notice">사진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`}
    ${data.status === "ready" && (list.length === 0
      ? html`<div class="empty"><span class="big">📷</span>아직 올라온 감사사진이 없어요.<br />감사했던 순간을 사진으로 남겨 보세요.</div>`
      : html`
        ${groups.map((g) => html`
          <h3 class="month-h">${g.label} <small>· ${g.items.length}장</small></h3>
          <div class="grid">
            ${g.items.map((p) => html`<button style=${{ backgroundImage: `url(${p.thumb})` }} onClick=${() => onOpen(p)} aria-label=${`${p.name} 사진 ${p.caption || ""}`}>
              <span>${p.name}</span></button>`)}
          </div>`)}
        ${data.items.length >= limit && html`<button class="more" onClick=${onMore}>사진 더 보기</button>`}`)}
  </div>`;
}

function PhotoForm({ entry, names, onClose, onDone }) {
  const [date, setDate] = useState(entry ? entry.date : todayStr());
  const [name, setName] = useState(entry ? entry.name : localStorage.getItem("pt-name") || "");
  const [caption, setCaption] = useState(entry ? entry.caption || "" : "");
  const [picks, setPicks] = useState([]);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const fileRef = useRef(null);

  function onFiles(ev) {
    const files = [...ev.target.files].filter((f) => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
    const next = [...picks, ...files.map((f) => ({ file: f, url: URL.createObjectURL(f) }))];
    if (next.length > 10) setErr("한 번에 10장까지 올릴 수 있어요.");
    setPicks(next.slice(0, 10));
    ev.target.value = "";
  }

  async function submit() {
    if (!name.trim()) return setErr("이름을 입력해 주세요.");
    if (!entry && !picks.length) return setErr("사진을 한 장 이상 골라 주세요.");
    setErr("");
    localStorage.setItem("pt-name", name.trim());
    try {
      if (entry) {
        setBusy("저장 중…");
        await api.save("photos", { ...entry, date, name: name.trim(), caption: caption.trim(), updatedAt: nowIso() });
        return onDone("사진 정보를 수정했어요");
      }
      for (let i = 0; i < picks.length; i++) {
        setBusy(`사진 올리는 중… ${i + 1} / ${picks.length}`);
        const { full, thumb } = await processPhoto(picks[i].file);
        const id = newId(), t = nowIso();
        await api.save("photo_full", { id, data: full.data });
        await api.save("photos", { id, date, name: name.trim(), caption: caption.trim(), thumb: thumb.data, w: full.w, h: full.h, createdAt: t, updatedAt: t });
      }
      onDone(`감사사진 ${picks.length}장을 올렸어요 📷`);
    } catch (e) {
      console.error(e);
      setErr(e && e.code === "permission-denied" ? "저장 권한이 없어요. 관리자에게 Firebase 규칙 확인을 부탁해 주세요."
        : /이미지/.test(e && e.message) ? "이 사진 형식은 읽을 수 없어요. 다른 사진으로 시도해 주세요." : "업로드에 실패했어요. 잠시 후 다시 시도해 주세요.");
      setBusy("");
    }
  }

  return html`<div class="overlay">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grip"></div>
      <div class="sheet-h">
        <h3>${entry ? "사진 정보 수정" : "감사사진 올리기"}</h3>
        <button class="xbtn" onClick=${onClose} aria-label="닫기" disabled=${!!busy}>✕</button>
      </div>
      ${entry
        ? html`<div class="picks"><div style=${{ backgroundImage: `url(${entry.thumb})` }}></div></div>`
        : html`
          <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${onFiles} />
          <button class="pickbtn" onClick=${() => fileRef.current && fileRef.current.click()}>
            <span style="font-size:26px">📷</span>사진 고르기 / 찍기<small>한 번에 최대 10장 · 자동으로 용량을 줄여서 올려요</small>
          </button>
          ${picks.length > 0 && html`<div class="picks">
            ${picks.map((p, i) => html`<div style=${{ backgroundImage: `url(${p.url})` }}>
              <button onClick=${() => setPicks(picks.filter((_, j) => j !== i))} aria-label="이 사진 빼기">✕</button></div>`)}
          </div>`}`}
      <div class="row2">
        <div class="field"><label>이름</label>
          <input value=${name} onInput=${(e) => setName(e.target.value)} placeholder="이름" list="pt-names2" autocomplete="off" />
          <datalist id="pt-names2">${names.map((n) => html`<option value=${n} />`)}</datalist>
        </div>
        <div class="field"><label>날짜</label><input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /></div>
      </div>
      <div class="field"><label>어떤 감사였나요? (선택)</label>
        <textarea rows="3" value=${caption} onInput=${(e) => setCaption(e.target.value)} placeholder="사진에 담긴 감사한 순간을 적어주세요"></textarea>
      </div>
      ${err && html`<p class="err">${err}</p>`}
      <button class="primary" onClick=${submit} disabled=${!!busy}>${busy || (entry ? "수정 완료" : `사진 ${picks.length ? picks.length + "장 " : ""}올리기`)}</button>
    </div>
  </div>`;
}

function Lightbox({ p, onClose, onEdit, onDelete }) {
  const [full, setFull] = useState(null);
  useEffect(() => {
    let alive = true; setFull(null);
    api.get("photo_full", p.id).then((d) => { if (alive && d) setFull(d.data); }).catch(() => {});
    return () => { alive = false; };
  }, [p.id]);
  return html`<div class="lightbox" role="dialog" aria-modal="true">
    <div class="lb-top">
      <button class="xbtn" onClick=${onClose} aria-label="닫기">✕</button>
      <div><button class="lb-btn" onClick=${onEdit}>수정</button><button class="lb-btn del" onClick=${onDelete}>삭제</button></div>
    </div>
    <div class="lb-img"><img src=${full || p.thumb} alt=${p.caption || "감사 사진"} /></div>
    <div class="lb-info"><small>${p.name} · ${fmtDate(p.date)}</small>${p.caption}</div>
  </div>`;
}

/* ---------- 삭제 확인창 ---------- */
function Confirm({ c, onClose }) {
  const [busy, setBusy] = useState(false);
  return html`<div class="overlay center" onClick=${(e) => { if (e.target === e.currentTarget && !busy) onClose(); }}>
    <div class="dialog" role="alertdialog" aria-modal="true">
      <div class="ic">🍂</div>
      <h4>${c.title}</h4>
      <p>${c.body}</p>
      <div class="btns">
        <button class="btn-cancel" onClick=${onClose} disabled=${busy}>취소</button>
        <button class="btn-danger" disabled=${busy} onClick=${async () => { setBusy(true); try { await c.onOk(); } finally { onClose(); } }}>
          ${busy ? "삭제 중…" : "삭제"}</button>
      </div>
    </div>
  </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
</script>
