const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const COLLECTION = "prayers";
const todayStr = () => new Date().toISOString().slice(0, 10);

function useEntries() {
  const [entries, setEntries] = useState([]);
  const [status, setStatus] = useState("loading");

  useEffect(() => {
    let unsub = null;
    let tries = 0;
    const tryInit = () => {
      if (window.__fb) {
        const { db, collection, onSnapshot } = window.__fb;
        unsub = onSnapshot(
          collection(db, COLLECTION),
          (snap) => {
            setEntries(snap.docs.map((d) => d.data()));
            setStatus("ready");
          },
          () => setStatus("error")
        );
      } else if (tries++ < 100) {
        setTimeout(tryInit, 50);
      } else {
        setStatus("error");
      }
    };
    tryInit();
    return () => unsub && unsub();
  }, []);

  async function addEntry(entry) {
    const { db, doc, setDoc } = window.__fb;
    await setDoc(doc(window.__fb.db, COLLECTION, entry.id), entry);
  }
  async function removeEntry(id) {
    const { db, doc, deleteDoc } = window.__fb;
    await deleteDoc(doc(window.__fb.db, COLLECTION, id));
  }

  return { entries, status, addEntry, removeEntry };
}

function hashOf(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}

function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth() + 1}.${d.getDate()} (${days[d.getDay()]})`;
}

function EntryCard({ entry, onDelete, onEdit, compact }) {
  const h = hashOf(entry.id);
  const rotate = (h % 7) - 3;
  const stringLen = [14, 22, 30][h % 3];
  const total = entry.prayers.length;
  const [page, setPage] = useState(0);
  const [confirming, setConfirming] = useState(false);
  const cur = Math.min(page, total - 1);

  return (
    <div className={`tag-item${compact ? " compact" : ""}`}>
      <div className="tag-string" style={{ height: stringLen }} />
      <div className="tag-card" style={{ transform: `rotate(${rotate}deg)` }}>
        <span className="tag-leaf">🌿</span>

        {confirming ? (
          <div className="tag-confirm pt-fade">
            <p>이 기도제목을<br />삭제할까요?</p>
            <div className="tag-confirm-btns">
              <button className="tag-confirm-cancel" onClick={() => setConfirming(false)}>취소</button>
              <button className="tag-confirm-ok" onClick={() => { onDelete(); setConfirming(false); }}>삭제</button>
            </div>
          </div>
        ) : (
          <div className="tag-actions">
            {onEdit && <button className="pt-btn tag-edit" onClick={onEdit} aria-label="수정" title="수정">✎</button>}
            <button className="pt-btn tag-delete" onClick={() => setConfirming(true)} aria-label="삭제" title="삭제">✕</button>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 1, marginBottom: 9, paddingRight: 68 }}>
          <span style={{ fontFamily: "'Noto Serif KR', serif", fontWeight: 700, fontSize: 14.5, color: "#173327" }}>{entry.name}</span>
          <span style={{ fontSize: 11, color: "#748072" }}>{formatDate(entry.date)}</span>
        </div>
        <div style={{ height: 0, borderTop: "1px dashed #ece6d6", margin: "0 0 10px" }} />

        <div
          onClick={total > 1 ? () => setPage((cur + 1) % total) : undefined}
          style={{ minHeight: 58, display: "flex", alignItems: "center", cursor: total > 1 ? "pointer" : "default" }}
        >
          <p style={{ margin: 0, fontSize: 13.5, lineHeight: 1.6, color: "#26332c" }}>{entry.prayers[cur]}</p>
        </div>

        {total > 1 && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10, paddingTop: 8, borderTop: "1px dashed #ece6d6" }}>
            <button className="pt-btn" onClick={() => setPage((cur - 1 + total) % total)} aria-label="이전 기도제목"
              style={{ border: "none", background: "transparent", color: "#3f6b52", fontSize: 15, cursor: "pointer", padding: "2px 6px" }}>‹</button>
            <span style={{ fontSize: 11, color: "#748072" }}>{cur + 1} / {total}</span>
            <button className="pt-btn" onClick={() => setPage((cur + 1) % total)} aria-label="다음 기도제목"
              style={{ border: "none", background: "transparent", color: "#3f6b52", fontSize: 15, cursor: "pointer", padding: "2px 6px" }}>›</button>
          </div>
        )}
      </div>
    </div>
  );
}

const LEAF_PALETTE = ["#2f5a44", "#3f6b52", "#557d5f", "#6f8f66", "#7fa383"];

function TreeView({ grouped, onDelete, onEdit }) {
  const [filterName, setFilterName] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  const names = useMemo(() => {
    const set = new Set();
    Object.values(grouped).forEach((arr) => arr.forEach((e) => set.add(e.name)));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "ko"));
  }, [grouped]);

  const branches = useMemo(() => {
    return MONTH_NAMES.map((name, i) => {
      const t = i / 11;
      const side = i % 2 === 0 ? -1 : 1;
      const startX = 200 + side * 3;
      const startY = 302 - t * 150;
      const spread = 48 + t * 78;
      const tipX = 200 + side * spread;
      const tipY = 268 - t * 205;
      const midX = (startX + tipX) / 2 + side * 22;
      const midY = (startY + tipY) / 2 - 6;
      const items = grouped[i] || [];
      return { i, name, startX, startY, midX, midY, tipX, tipY, items };
    });
  }, [grouped]);

  const CREAM_DEEP = "#ece6d6";

  return (
    <div>
      {names.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <button className="pt-btn" onClick={() => setMenuOpen((v) => !v)}
            style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", background: "#fff", border: `1px solid ${CREAM_DEEP}`, borderRadius: 10, padding: "11px 14px", fontSize: 14, color: "#26332c", cursor: "pointer" }}>
            <span>이름 <strong style={{ color: "#3f6b52" }}>{filterName || "전체"}</strong></span>
            <span style={{ display: "inline-block", transform: menuOpen ? "rotate(180deg)" : "none", transition: "transform .15s ease" }}>▾</span>
          </button>
          {menuOpen && (
            <div className="pt-fade" style={{ marginTop: 6, background: "#fff", border: `1px solid ${CREAM_DEEP}`, borderRadius: 10, overflow: "hidden", maxHeight: 260, overflowY: "auto" }}>
              <button className="pt-btn" onClick={() => { setFilterName(null); setMenuOpen(false); }}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", textAlign: "left", background: filterName === null ? "#eef2ea" : "transparent", border: "none", borderTop: `1px solid ${CREAM_DEEP}`, padding: "11px 14px", fontSize: 14, color: filterName === null ? "#173327" : "#26332c", fontWeight: filterName === null ? 700 : 400, cursor: "pointer" }}>
                <span>전체</span>{filterName === null && <span>✓</span>}
              </button>
              {names.map((n) => (
                <button key={n} className="pt-btn" onClick={() => { setFilterName(n); setMenuOpen(false); }}
                  style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", textAlign: "left", background: filterName === n ? "#eef2ea" : "transparent", border: "none", borderTop: `1px solid ${CREAM_DEEP}`, padding: "11px 14px", fontSize: 14, color: filterName === n ? "#173327" : "#26332c", fontWeight: filterName === n ? 700 : 400, cursor: "pointer" }}>
                  <span>{n}</span>{filterName === n && <span>✓</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      <svg viewBox="0 0 400 470" style={{ width: "100%", maxWidth: 380, display: "block", margin: "0 auto" }}>
        <path d="M 200,466 C 194,420 206,370 199,300" stroke="#3b2a1e" strokeWidth="15" fill="none" strokeLinecap="round" opacity="0.9" />
        {branches.map((b) => {
          const hasItems = b.items.length > 0;
          return (
            <g key={b.i}>
              <path d={`M ${b.startX},${b.startY} Q ${b.midX},${b.midY} ${b.tipX},${b.tipY}`}
                stroke={hasItems ? "#4a3b2a" : "#a89c86"} strokeWidth={hasItems ? 3.4 : 1.6} fill="none"
                strokeLinecap="round" strokeDasharray={hasItems ? undefined : "2 4"} opacity={hasItems ? 0.85 : 0.5} />
              {b.items.map((e, idx) => {
                const h = hashOf(e.id);
                const jx = ((h % 46) - 23) * 1;
                const jy = (((h >> 4) % 40) - 20) * 0.9 - Math.min(idx, 10) * 2.2;
                const r = 5.5 + (h % 3) * 1.6;
                const color = LEAF_PALETTE[h % LEAF_PALETTE.length];
                const isMine = filterName && e.name === filterName;
                const isDim = filterName && e.name !== filterName;
                return (
                  <circle key={e.id} cx={b.tipX + jx} cy={b.tipY + jy} r={isMine ? r + 1.5 : r}
                    fill={color} opacity={isDim ? 0.12 : isMine ? 0.98 : 0.82}
                    stroke={isMine ? "#a1524f" : "rgba(255,255,255,0.5)"}
                    strokeWidth={isMine ? 1.6 : 0.6} style={{ transition: "opacity .15s ease" }} />
                );
              })}
              <text x={b.tipX} y={b.tipY + (b.tipY < 220 ? -12 : 16)} fontSize="9.5" textAnchor="middle"
                fill="#3f6b52" fontFamily="'Noto Serif KR', serif" opacity={hasItems ? 0.95 : 0.55}>
                {b.name}{hasItems ? ` · ${b.items.length}` : ""}
              </text>
            </g>
          );
        })}
      </svg>

      <div style={{ marginTop: 18 }}>
        {(() => {
          const monthsWithItems = branches
            .map((b) => ({ ...b, items: filterName ? b.items.filter((e) => e.name === filterName) : b.items }))
            .filter((b) => b.items.length > 0);
          if (monthsWithItems.length === 0) {
            return (
              <p style={{ textAlign: "center", color: "#748072", fontSize: 13, margin: "14px 0" }}>
                {filterName ? `${filterName}님이 이 해에 남긴 기도제목이 아직 없어요.` : "🌿 잎사귀를 눌러보거나, 달마다 쌓인 기도제목을 아래에서 볼 수 있어요."}
              </p>
            );
          }
          return monthsWithItems.map((b) => (
            <div key={b.i} style={{ marginBottom: 22 }}>
              <h3 style={{ fontFamily: "'Noto Serif KR', serif", fontSize: 15.5, fontWeight: 700, color: "#173327", borderBottom: `1px solid ${CREAM_DEEP}`, paddingBottom: 6, marginBottom: 10 }}>
                {b.name} <span style={{ fontFamily: "'Noto Sans KR', sans-serif", fontWeight: 500, fontSize: 13, color: "#748072" }}>· {b.items.length}건</span>
              </h3>
              <div className="tag-row">
                {b.items.map((e) => <EntryCard key={e.id} entry={e} compact onDelete={() => onDelete(e.id)} onEdit={() => onEdit(e)} />)}
              </div>
            </div>
          ));
        })()}
      </div>
    </div>
  );
}

function PrayerTree() {
  const { entries, status, addEntry, removeEntry } = useEntries();
  const [year, setYear] = useState(new Date().getFullYear());
  const [monthIdx, setMonthIdx] = useState(new Date().getMonth());

  const [fName, setFName] = useState("");

  const [notice, setNotice] = useState("");

  const yearEntries = useMemo(
    () => entries.filter((e) => new Date(e.date + "T00:00:00").getFullYear() === year),
    [entries, year]
  );
  const monthEntries = useMemo(
    () => yearEntries.filter((e) => new Date(e.date + "T00:00:00").getMonth() === monthIdx)
      .sort((a, b) => (a.date < b.date ? 1 : -1)),
    [yearEntries, monthIdx]
  );
  const countsByMonth = useMemo(() => {
    const c = Array(12).fill(0);
    yearEntries.forEach((e) => c[new Date(e.date + "T00:00:00").getMonth()]++);
    return c;
  }, [yearEntries]);
  const grouped = useMemo(() => {
    const g = {};
    yearEntries.forEach((e) => {
      const m = new Date(e.date + "T00:00:00").getMonth();
      (g[m] = g[m] || []).push(e);
    });
    Object.values(g).forEach((arr) => arr.sort((a, b) => (a.date < b.date ? 1 : -1)));
    return g;
  }, [yearEntries]);
  const totalThisYear = yearEntries.length;

    setFDate(todayStr());

    setFPrayers(["", "", ""]);
    setEditingId(null);
  }

    setFPrayers(entry.prayers.length ? [...entry.prayers] : [""]);

    const d = new Date(entry.date + "T00:00:00");
    setYear(d.getFullYear());
    setMonthIdx(d.getMonth());
    setMode("month");
    setFormOpen(true);

      setTimeout(() => setNotice(""), 2500);
      return;

    setSaving(true);

      id: editingId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      date: fDate,
      name: fName.trim(),
      prayers: cleanPrayers,
      createdAt: new Date().toISOString(),

      setMode("month");
      resetForm();
      setFormOpen(false);

      </header>

      <div className="twine-wrap" aria-hidden="true">
        <svg viewBox="0 0 720 30" preserveAspectRatio="none" style={{ width: "100%", height: 22, display: "block" }}>
          <path d="M0 16 C 90 2, 180 28, 270 14 S 450 0, 540 16 S 660 26, 720 12" stroke="#b7a888" strokeWidth="1.4" fill="none" strokeLinecap="round" strokeDasharray="1 6" />
        </svg>
        <div className="twine-leaves">
          {[0,1,2,3,4,5,6].map((i) => <span key={i}>🌿</span>)}
        </div>
      </div>

      <main style={{ maxWidth: 720, margin: "0 auto", padding: "22px 16px 40px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          <button className="pt-btn" onClick={() => setYear((y) => y - 1)} style={{ width: 30, height: 30, borderRadius: 8, border: `1px solid ${CREAM_DEEP}`, background: "#fff", color: GREEN_MID, cursor: "pointer" }}>‹</button>
          <div style={{ fontFamily: "'Noto Serif KR', serif", fontWeight: 700, fontSize: 19, color: GREEN_DARK, minWidth: 62, textAlign: "center" }}>{year}년</div>
          <button className="pt-btn" onClick={() => setYear((y) => y + 1)} style={{ width: 30, height: 30, borderRadius: 8, border: `1px solid ${CREAM_DEEP}`, background: "#fff", color: GREEN_MID, cursor: "pointer" }}>›</button>
          <div style={{ marginLeft: "auto", fontSize: 12.5, color: GREEN_MID, background: "#e7efe3", border: "1px solid #d3e0cc", borderRadius: 999, padding: "5px 10px" }}>{year}년 누적 {totalThisYear}건</div>
          <div style={{ display: "flex", background: "#fff", border: `1px solid ${CREAM_DEEP}`, borderRadius: 10, padding: 3, gap: 2, width: "100%", marginTop: 6 }}>
            <button className="pt-btn" onClick={() => setMode("month")} style={{ flex: 1, border: "none", background: mode === "month" ? GREEN_DARK : "transparent", color: mode === "month" ? "#fff" : MUTED, padding: "7px 10px", fontSize: 13, borderRadius: 7, cursor: "pointer" }}>월별 보기</button>
            <button className="pt-btn" onClick={() => setMode("tree")} style={{ flex: 1, border: "none", background: mode === "tree" ? GREEN_DARK : "transparent", color: mode === "tree" ? "#fff" : MUTED, padding: "7px 10px", fontSize: 13, borderRadius: 7, cursor: "pointer" }}>나무 보기</button>
          </div>
        </div>

        {mode === "month" && (
          <div className="pt-scroll" style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 18 }}>
            {MONTH_NAMES.map((m, i) => (
              <button key={m} className="pt-btn" onClick={() => { setMonthIdx(i); setMode("month"); }}
                style={{ flex: "0 0 auto", display: "inline-flex", alignItems: "center", gap: 5, padding: "7px 13px", borderRadius: 999, border: `1px solid ${CREAM_DEEP}`, background: mode === "month" && monthIdx === i ? GREEN_MID : "#fff", borderColor: mode === "month" && monthIdx === i ? GREEN_MID : CREAM_DEEP, color: mode === "month" && monthIdx === i ? "#fff" : "#26332c", fontSize: 13.5, cursor: "pointer", whiteSpace: "nowrap" }}>
                {m}
                {countsByMonth[i] > 0 && <span style={{ fontSize: 11, background: mode === "month" && monthIdx === i ? "rgba(255,255,255,0.25)" : "#eef2ea", color: mode === "month" && monthIdx === i ? "#fff" : GREEN_MID, borderRadius: 999, padding: "1px 6px", fontWeight: 600 }}>{countsByMonth[i]}</span>}
              </button>
            ))}
          </div>
        )}

        {status === "loading" && <div style={{ textAlign: "center", color: MUTED, padding: "40px 0", fontSize: 14 }}>불러오는 중…</div>}
        {status === "error" && <div style={{ textAlign: "center", color: "#a1524f", padding: "40px 0", fontSize: 13.5 }}>Firebase 연결에 실패했어요. index.html 상단의 firebaseConfig 값을 확인해주세요.</div>}

        {status === "ready" && mode === "month" && (
          <section className="pt-fade">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
              <h2 style={{ fontFamily: "'Noto Serif KR', serif", fontSize: 18, fontWeight: 700, color: GREEN_DARK, margin: 0 }}>
                {year}년 {MONTH_NAMES[monthIdx]} <span style={{ fontFamily: "'Noto Sans KR', sans-serif", fontWeight: 500, fontSize: 13, color: MUTED }}>· {monthEntries.length}건</span>
              </h2>
              <button className="pt-btn" onClick={() => { if (formOpen) { resetForm(); } setFormOpen((v) => !v); }} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: GREEN_DARK, color: "#fff", border: "none", borderRadius: 8, padding: "8px 13px", fontSize: 13, cursor: "pointer" }}>
                {formOpen ? "✕ 닫기" : "＋ 기도제목 추가"}
              </button>
            </div>

            {formOpen && (
              <div className="pt-fade" style={{ background: "#fff", border: `1px solid ${CREAM_DEEP}`, borderRadius: 14, padding: 16, marginBottom: 18, display: "flex", flexDirection: "column", gap: 12 }}>
                {editingId && (
                  <div style={{ fontSize: 12.5, color: "#a1524f", background: "#fbeceb", border: "1px solid #f0d8d6", borderRadius: 8, padding: "7px 10px" }}>
                    ✎ 기도제목을 수정하는 중이에요
                  </div>
                )}
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  <label style={{ fontSize: 12.5, color: GREEN_MID, fontWeight: 600 }}>📅 작성 날짜</label>
                  <input type="date" value={fDate} onChange={(e) => setFDate(e.target.value)} style={{ border: `1px solid ${CREAM_DEEP}`, borderRadius: 8, padding: "9px 11px", fontSize: 14, background: "#f4f1e6" }} />
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  <label style={{ fontSize: 12.5, color: GREEN_MID, fontWeight: 600 }}>✎ 이름</label>
                  <input type="text" value={fName} onChange={(e) => setFName(e.target.value)} placeholder="이름을 입력하세요" style={{ border: `1px solid ${CREAM_DEEP}`, borderRadius: 8, padding: "9px 11px", fontSize: 14, background: "#f4f1e6" }} />
                </div>
                {fPrayers.map((val, i) => (
                  <div key={i} style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <label style={{ fontSize: 12.5, color: GREEN_MID, fontWeight: 600 }}>기도제목 {i + 1}</label>
                      {fPrayers.length > 1 && (
                        <button type="button" onClick={() => setFPrayers(fPrayers.filter((_, idx) => idx !== i))}
                          style={{ width: 20, height: 20, display: "grid", placeItems: "center", border: "none", background: "transparent", color: "#c9bfa5", cursor: "pointer", borderRadius: 5 }}
                          aria-label="이 기도제목 삭제">✕</button>
                      )}
                    </div>
                    <textarea rows={2} value={val} onChange={(e) => { const next = [...fPrayers]; next[i] = e.target.value; setFPrayers(next); }}
                      placeholder={i === 0 ? "기도제목을 적어주세요 (필수)" : "기도제목 (선택)"}
                      style={{ border: `1px solid ${CREAM_DEEP}`, borderRadius: 8, padding: "9px 11px", fontSize: 14, background: "#f4f1e6", resize: "vertical", fontFamily: "inherit" }} />
                  </div>
                ))}
                <button type="button" onClick={() => setFPrayers([...fPrayers, ""])}
                  style={{ alignSelf: "flex-start", display: "inline-flex", alignItems: "center", gap: 5, background: "transparent", border: "1px dashed #cfd8c9", color: GREEN_MID, borderRadius: 8, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                  ＋ 기도제목 더 추가
                </button>
                {notice && <div style={{ fontSize: 12.5, color: "#a1524f" }}>{notice}</div>}
                <button type="button" onClick={submitEntry} disabled={saving}
                  style={{ background: GREEN_MID, color: "#fff", border: "none", borderRadius: 9, padding: "11px", fontSize: 14, fontWeight: 600, cursor: "pointer", opacity: saving ? 0.7 : 1 }}>
                  {saving ? "저장 중…" : editingId ? "수정 완료" : "기도나무에 새기기"}
                </button>
              </div>
            )}

            {monthEntries.length === 0 ? (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, color: MUTED, padding: "36px 0", fontSize: 13.5, textAlign: "center" }}>
                <span style={{ fontSize: 22 }}>🌿</span>
                <p>아직 이 달에 심어진 기도제목이 없어요.</p>
              </div>
            ) : (
              <div className="tag-row">
                {monthEntries.map((e) => <EntryCard key={e.id} entry={e} onDelete={() => removeEntry(e.id)} onEdit={() => startEdit(e)} />)}
              </div>
            )}
          </section>
        )}

        {status === "ready" && mode === "tree" && (
          <section className="pt-fade">
            {totalThisYear === 0 ? (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, color: MUTED, padding: "36px 0", fontSize: 13.5, textAlign: "center" }}>
                <span style={{ fontSize: 22 }}>🌿</span>
                <p>{year}년에 기록된 기도제목이 아직 없어요.</p>
              </div>
            ) : (
              <TreeView grouped={grouped} onDelete={removeEntry} onEdit={startEdit} />
            )}
          </section>
        )}
      </main>

      <footer style={{ textAlign: "center", color: MUTED, fontSize: 12, padding: "10px 0 28px" }}>이 페이지의 기록은 95년 동기 모두에게 함께 보여요 🌿</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PrayerTree />);
</script>

<script>
  (function () {
    var raw = document.getElementById("app-src").textContent;
    var result = Babel.transform(raw, { presets: [["react", { runtime: "classic" }]] });
    (0, eval)(result.code);
  })();
</script>
</body>
</html>
