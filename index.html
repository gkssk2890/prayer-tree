/* 기도항아리 | Complete red + cream design system.
   The document loads Pretendard or SUIT. This replaces every prior style block. */
:root {

  --nav: 72px;

  --sans: 'Pretendard', 'SUIT', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
  /* Legacy components read these tokens too. */
  --y: #F8E8E9;
  --o: #AC1730;
  --r: #AC1730;
  --p: #F8E8E9;
  --pu: #AC1730;
  --b: #386B8A;
  --g: #416A59;
  --m: #F5F1E8;
  --jar-accent: #AC1730;
  --jar-accent-hover: #8E1027;
  --jar-line: #E4DED5;
  --jar-soft: #F8E8E9;
  --jar-sans: var(--sans);
  --jar-serif: var(--sans);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { margin: 0; background: var(--bg); scroll-padding-top: 88px; -webkit-text-size-adjust: 100%; }

button, input, textarea, select { font: inherit; color: inherit; }
button, a, summary { touch-action: manipulation; }
button { cursor: pointer; }
button { min-height: 44px; }
button:disabled { opacity: .5; cursor: not-allowed; }
button, input, textarea, select { max-width: 100%; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--red); outline-offset: 4px;
}
input::placeholder, textarea::placeholder { color: #868187; opacity: 1; }
input, textarea { accent-color: var(--red); }
input[type='date'] { min-width: 0; }
img, svg { vertical-align: middle; }
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3, h4, h5, h6, .disp { font-family: var(--sans); color: var(--ink); font-weight: 800; letter-spacing: -.045em; line-height: 1.3; }

a { color: var(--red); }

.app { width: 100%; max-width: 1000px; min-height: 100vh; min-height: 100svh; margin: 0 auto; padding-bottom: calc(var(--nav) + 90px + env(safe-area-inset-bottom)); }
.wrap { width: 100%; max-width: 820px; padding: 28px 28px 36px; margin: 0 auto; }

.demo-badge { color: var(--red); background: var(--red-soft); border-bottom: 1px solid #EBD5D9; }

/* App header. */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 76px; padding: calc(12px + env(safe-area-inset-top)) 28px 12px; color: var(--ink); background: rgba(255,249,238,.97); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
.logo { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; text-align: left; }

/* Fixed, five-item navigation. Inline SVGs are constrained at both levels. */
.fab { position: fixed; z-index: 30; right: max(20px,calc(50% - 472px)); bottom: calc(var(--nav) + 16px + env(safe-area-inset-bottom)); min-height: 50px; padding: 12px 22px; border: 1px solid var(--red); border-radius: 99px; color: #fff; background: var(--red); font-size: 14px; font-weight: 750; box-shadow: 0 5px 20px rgba(172,23,48,.16); }

/* Sheets remain fixed above the app and have their own scrolling boundary. */

/* Name gate, notifications and install help. */

/* Photos retain their interaction model. */

.strip button { position: relative; flex: 0 0 100px; width: 100px; height: 100px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface) center/cover no-repeat; }

.lb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; color: #fff; }

/* Graceful legacy home fallback without the former visual language. */

  const found = THEMES.map((th) => ({ th, s: th.kw.reduce((c, k) => c + (t.split(k).length - 1), 0) }))
    .filter((x) => x.s > 0).sort((a, b) => b.s - a.s).map((x) => x.th);
  const fr = FRUIT[fruitId];
  const h = hashOf(seed), picked = [];
  const take = (refs, k) => { const r = refs.filter((x) => !picked.some((p) => p.ref === x)); if (r.length) { const ref = r[(h >>> (k * 4)) % r.length]; picked.push({ ref, text: VERSES[ref] }); } };

  const pools = found.slice(0, need).map((x) => x.refs);
  while (pools.length < need) pools.push(JOY.refs);
  pools.forEach((refs, i) => take(refs, i));
  if (fr) take(fr.refs, 5);
  const tags = found.slice(0, 2).map((x) => x.tag);

/* ---------- 데이터 연결 ---------- */
async function makeFirebaseApi() {
  const A = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
  const db = F.getFirestore(A.initializeApp(firebaseConfig));
  return {
    watch(coll, cb, onErr, lim) {
      const ref = F.collection(db, coll);
      const q = lim ? F.query(ref, F.orderBy("createdAt", "desc"), F.limit(lim)) : ref;
      return F.onSnapshot(q, (s) => cb(s.docs.map((d) => d.data())), onErr);
    },
    save: (coll, obj) => F.setDoc(F.doc(db, coll, obj.id), obj),
    remove: (coll, id) => F.deleteDoc(F.doc(db, coll, id)),
    arr: (coll, id, field, value, add) => F.updateDoc(F.doc(db, coll, id), { [field]: add ? F.arrayUnion(value) : F.arrayRemove(value) }),
    reactTo: (coll, id, key, name, add) => F.updateDoc(F.doc(db, coll, id), new F.FieldPath("reactions", key), add ? F.arrayUnion(name) : F.arrayRemove(name)),
    async get(coll, id) { const s = await F.getDoc(F.doc(db, coll, id)); return s.exists() ? s.data() : null; },
  };
}

function makeDemoApi() {
  const KEY = "pt-demo-v3";
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { db = null; }
  if (!db) db = seedDemo();
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn("demo storage full"); } };
  persist();
  const emit = () => { persist(); subs.forEach((s) => s()); };
  return {
    watch(coll, cb, onErr, lim) {
      const fire = () => {
        let arr = Object.values(db[coll] || {});
        if (lim) arr = arr.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, lim);
        cb(arr.map((x) => JSON.parse(JSON.stringify(x))));
      };
      subs.add(fire); setTimeout(fire, 100);
      return () => subs.delete(fire);
    },
    async save(coll, obj) { (db[coll] = db[coll] || {})[obj.id] = JSON.parse(JSON.stringify(obj)); emit(); },
    async remove(coll, id) { if (db[coll]) delete db[coll][id]; emit(); },
    async reactTo(coll, id, key, name, add) {
      const d = (db[coll] || {})[id]; if (!d) throw new Error("not-found");
      d.reactions = d.reactions || {}; const cur = new Set(d.reactions[key] || []); add ? cur.add(name) : cur.delete(name); d.reactions[key] = [...cur]; emit();
    },
    async arr(coll, id, field, value, add) {
      const d = (db[coll] || {})[id]; if (!d) throw new Error("not-found");
      const cur = new Set(d[field] || []); add ? cur.add(value) : cur.delete(value); d[field] = [...cur]; emit();
    },
    async get(coll, id) { return (db[coll] || {})[id] || null; },
  };
}

/* ---------- 사진 줄이기 ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("이미지를 읽을 수 없어요"));
    img.src = URL.createObjectURL(file);
  });
}
function shrink(img, max, q) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", q), w: c.width, h: c.height };
}
async function processPhoto(file, thumbMax = 640) {
  const img = await loadImage(file);
  let full;
  for (const [m, q] of [[1600, 0.82], [1280, 0.78], [1080, 0.72], [900, 0.65], [720, 0.6]]) {
    full = shrink(img, m, q);
    if (full.data.length < 850000) break;
  }
  return { full, thumb: shrink(img, thumbMax, 0.72) };
}

/* ---------- 통계 (카드 능력치) ---------- */
function streakOf(days) {
  const has = (d) => days.has(dstr(d));
  const d = new Date();
  if (!has(d)) d.setDate(d.getDate() - 1);
  let n = 0;
  while (has(d) && n < 999) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function useStats(P, G, M, D = []) {
  return useMemo(() => {
    const S = {};
    const get = (n) => (S[n] = S[n] || { topics: 0, thanks: 0, answered: 0, inter: 0, days: new Set() });
    P.forEach((e) => {
      if (!e.name) return;
      const s = get(e.name); s.topics += (e.prayers || []).length; s.answered += (e.answered || []).filter(Boolean).length;
      if (e.date) s.days.add(e.date);
      (e.prayedBy || []).forEach((n) => get(n).inter++);
    });
    G.forEach((e) => { if (!e.name) return; const s = get(e.name); s.thanks++; if (e.date) s.days.add(e.date); (e.amenBy || []).forEach((n) => get(n).inter++); });
    D.forEach((e) => { if (!e.name) return; const s = get(e.name); s.daily = (s.daily || 0) + 1; if (e.date) s.days.add(e.date); });
    [...P, ...G, ...D].forEach((e) => Object.values(e.reactions || {}).forEach((arr) => (arr || []).forEach((n) => get(n).inter++)));
    M.forEach((m) => { const s = get(m.name); (m.days || []).forEach((d) => s.days.add(d)); });
    Object.values(S).forEach((s) => {
      s.streak = streakOf(s.days);
      const score = s.topics + s.thanks * 2 + (s.daily || 0) * 2 + s.inter + s.days.size;
      s.score = score; s.lv = 1 + Math.floor(score / 5);
      s.stars = score >= 60 ? 4 : score >= 30 ? 3 : score >= 10 ? 2 : 1;
    });
    return S;
  }, [P, G, M, D]);
}

  }, [members, P.items, G.items, PH.items]);
  const canEdit = (e) => ADMIN || (me && e.name === me.name);

  const needGate = M.status === "ready" && !me && !browse && !gate;

          onClose=${() => setBellOpen(false)} onInstall=${() => { setBellOpen(false); setInstallOpen(true); }} />`}
      ${confirm && html`<${Confirm} c=${confirm} onClose=${() => setConfirm(null)} />`}
      ${toast && html`<div class="toast" role="status">${toast}</div>`}

}

/* ---------- 이름 확인 ---------- */
function similarNames(q, names) {
  q = (q || "").trim(); if (!q) return [];
  return names.filter((n) => n !== q && (n.includes(q) || q.includes(n) || (q.length >= 2 && n.length >= 2 && n.slice(-2) === q.slice(-2)))).slice(0, 8);
}
function NameCheck({ q, names, byName, stats, dark, onPick }) {
  const n = (q || "").trim();
  if (!n) return null;
  const m = byName[n], s = stats[n], sim = similarNames(n, names);
  const cnt = s ? `기도제목 ${s.topics}개 · 감사 ${s.thanks}개` : "";
  return html`<div class=${dark ? "ncheck" : "box"} style=${dark ? null : { padding: "12px 14px", marginBottom: "12px", fontSize: "14.5px", lineHeight: 1.6 }}>
    ${m ? html`✅ <b>${n}</b>님으로 이어서 시작할 수 있어요${cnt && html`<br />${cnt}`}`
      : names.includes(n) ? html`📝 <b>${n}</b>님 이름으로 쓴 글이 있어요 (${cnt}).<br />같은 이름으로 시작하면 이 기록과 연결돼요.`
      : html`<b>${n}</b>님으로 새로 시작해요.`}
    ${!m && sim.length > 0 && html`<div style="margin-top:6px">혹시 이 이름인가요? (띄어쓰기나 오타를 확인해 주세요)</div>
      <div class="sim" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${sim.map((x) => html`<button class=${dark ? "" : "chip"} onClick=${() => onPick(x)}>${x}${byName[x] ? " ✅" : ""}</button>`)}</div>`}
  </div>`;
}

/* ---------- 입장 화면 ---------- */
function Gate({ names, members, byName, stats, onEnter, onCreate, onBrowse }) {
  const [name, setName] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function go(e) {
    if(e) e.preventDefault();
    const n = name.trim();
    if (!n) return setErr("이름을 입력해 주세요");
    if (n.length > 10) return setErr("이름은 10자 이내로 적어 주세요");
    setBusy(true); setErr("");
    try { const m = byName[n]; if(m) await onEnter(m); else await onCreate(n); }
    catch(e) { setErr(e.message === "name-id-collision" ? "이 이름은 기존 이름과 겹쳐요. 띄어쓰기나 특수문자 없이 입력해 주세요." : "이름을 저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요."); setBusy(false); }
  }
  return html`<main class="gate gate-simple">
    <div class="gate-art"><${Av} a=${defaultAvatar("시작")} /></div>
    <p class="gate-kicker">95 공동체 · 횃불기도</p>
    <h1 class="gate-title">반가워요!<br />이름을 알려주세요.</h1>
    <p class="gate-description">이름만 입력하면 바로 시작해요.<br />전에 쓰던 이름을 입력하면 기존 기록과 연결돼요.</p>
    <form class="gate-form" onSubmit=${go}>
      <label for="gate-name">내 이름</label>
      <input id="gate-name" value=${name} onInput=${(e) => {setName(e.target.value);setErr("");}} placeholder="예: 유한나" list="gate-names" autocomplete="name" maxlength="10" aria-describedby="gate-note" />
      <datalist id="gate-names">${names.map((n) => html`<option value=${n} />`)}</datalist>
      <${NameCheck} q=${name} names=${names} byName=${byName} stats=${stats} dark=${false} onPick=${(x) => {setName(x);setErr("");}} />
      ${err && html`<p class="err" role="alert">${err}</p>`}
      <button class="btn full" type="submit" disabled=${busy}>${busy ? "연결하는 중…" : "이 이름으로 시작하기"}</button>
    </form>
    <button class="skip" type="button" onClick=${onBrowse}>나중에 등록하고 둘러보기</button>
    <p class="gate-note" id="gate-note">기도와 감사는 공동체에 공개돼요.<br />캐릭터는 홈에서 언제든 꾸밀 수 있어요.</p>
  </main>`;
}

function Editor({name,member,stat,onClose,onSave}) {
  const [a,setA]=useState(()=>mascotNormalize(member?.avatar,name));
  const [tab,setTab]=useState('expression');
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState('');
  const mascotDialogRef=useRef(null);
  const mascotBusyRef=useRef(false);
  useEffect(()=>{
    const oldOverflow=document.body.style.overflow;
    const oldFocus=document.activeElement;
    document.body.style.overflow='hidden';
    const root=mascotDialogRef.current;
    root?.querySelector('button')?.focus();
    const handle=(event)=>{
      if(event.key==='Escape'&&!mascotBusyRef.current){event.preventDefault();onClose();}
      if(event.key==='Tab'&&root){const buttons=[...root.querySelectorAll('button:not([disabled])')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
    };
    document.addEventListener('keydown',handle);
    return ()=>{document.body.style.overflow=oldOverflow;document.removeEventListener('keydown',handle);oldFocus?.focus?.();};
  },[]);
  const options={expression:mascotExpressions,accessory:mascotAccessories,accent:mascotColors,backdrop:mascotBackdrops}[tab];
  const pick=(id)=>{setA(current=>({...current,[tab]:id}));setError('');};
  async function save(){
    if(mascotBusyRef.current)return;
    mascotBusyRef.current=true;setBusy(true);setError('');
    try{await onSave({avatar:mascotNormalize(a,name)});}
    catch(e){setError(e?.code==='permission-denied'?'저장 권한을 확인해 주세요. 관리자에게 문의해 주세요.':'저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.');}
    finally{mascotBusyRef.current=false;setBusy(false);}
  }
  return html`<div class="overlay mascot-editor-overlay" onClick=${e=>e.target===e.currentTarget&&!busy&&onClose()}>
    <style>${mascotEditorCss}</style>
    <section ref=${mascotDialogRef} class="mascot-editor" role="dialog" aria-modal="true" aria-label="내 캐릭터 꾸미기" aria-busy=${busy}>
      <header class="mascot-editor-header">
        <button type="button" class="mascot-editor-icon" disabled=${busy} onClick=${onClose} aria-label="돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" /></svg></button>
        <h3>내 캐릭터 꾸미기</h3>
        <button type="button" class="mascot-editor-icon" disabled=${busy} onClick=${onClose} aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" /></svg></button>
      </header>
      <div class="mascot-editor-preview"><${Av} a=${a} name=${name} cls="av mascot-editor-hero" /><strong>${name || '나의 캐릭터'}</strong><p>작은 모습에 나의 마음을 담아요</p></div>
      <div class="mascot-editor-tabs" role="tablist" aria-label="꾸미기 종류">${mascotTabs.map(([id,label])=>html`<button key=${id} type="button" class="mascot-editor-tab" role="tab" aria-selected=${tab===id} aria-controls="mascot-editor-options" disabled=${busy} onClick=${()=>setTab(id)}>${label}</button>`)}</div>
      <div class="mascot-editor-options" id="mascot-editor-options" role="tabpanel" aria-label=${mascotTabs.find(([id])=>id===tab)[1]}>
        ${options.map(([id,label])=>{
          const preview={...a,[tab]:id};
          const crop=tab==='expression' && id!=='prayer' && id!=='happy' ? 'face':undefined;
          return html`<button key=${tab+id} type="button" class="mascot-editor-choice" aria-label=${label} aria-pressed=${a[tab]===id} disabled=${busy} onClick=${()=>pick(id)}>${a[tab]===id?html`<span class="mascot-choice-check" aria-hidden="true">✓</span>`:''}<${Av} a=${preview} cls=${'av mascot-editor-thumb'+(crop?' face':'')} crop=${crop}/><span>${tab==='accent'?html`<i class="mascot-editor-color-dot" style=${{background:id}} aria-hidden="true"></i>`:''}${label}</span></button>`;
        })}
      </div>
      <footer class="mascot-editor-footer">${error?html`<p class="mascot-editor-error" role="alert">${error}</p>`:''}<button type="button" class="mascot-editor-save" disabled=${busy} onClick=${save}>${busy?'저장하고 있어요…':'이 모습으로 저장'}</button></footer>
    </section>
  </div>`;
}

function CardModal({name,member,stat,mine,onClose,onEdit,onPrayers,onLogout}) {
  return html`<div class="overlay center" onClick=${e=>e.target===e.currentTarget&&onClose()}><section class="character-modal" role="dialog" aria-modal="true" aria-label=${name+"님의 캐릭터"}>

    ${mine && html`<button class="text-link" onClick=${onLogout}>다른 이름으로 시작</button>`}
  </section></div>`;
}

  const texts = me ? P.items.filter(e=>e.name===me.name).flatMap(e=>e.prayers||[]).slice(0,6) : [];

    ${unread.length>0 && html`<button class="new-prayer-note" onClick=${onBell}><${Icon} name="bell" />새 기도 ${unread.length}건이 도착했어요<span>보기 →</span></button>`}

    ${installCard && html`<div class="install-note"><p>홈 화면에 추가하면 더 쉽게 만나요.</p><button class="text-link" onClick=${onInstall}>앱처럼 추가</button><button class="icon-btn" aria-label="설치 안내 닫기" onClick=${onHideInstall}><${Icon} name="close" /></button></div>`}

/* ---------- 기도 / 감사 목록 ---------- */
function ListTab({ kind, data, year, month, setMonth, scope, setScope, who, setWho, names, freshId, me, avOf, byName, canEdit, onEdit, onDelete, onToggle, onReact, onEmoji }) {
  const isP = kind === "prayer";
  const unit = isP ? "기도제목" : "감사";
  const base = useMemo(() => data.items.filter((e) => e.date && (!who || e.name === who)), [data.items, who]);
  const counts = useMemo(() => { const c = Array(12).fill(0); base.forEach((e) => { const d = ym(e.date); if (d.y === year) c[d.m]++; }); return c; }, [base, year]);
  const list = useMemo(() => base.filter((e) => {
    const d = ym(e.date);
    return scope === "all" ? true : scope === "year" ? d.y === year : d.y === year && d.m === month;
  }).sort(sortDesc), [base, scope, year, month]);
  const groups = useMemo(() => {
    const out = [];
    list.forEach((e) => {
      const d = ym(e.date), key = `${d.y}-${d.m}`;
      if (!out.length || out[out.length - 1].key !== key) out.push({ key, label: `${scope === "all" ? d.y + "년 " : ""}${MONTHS[d.m]}`, items: [] });
      out[out.length - 1].items.push(e);
    });
    return out;
  }, [list, scope]);
  const chipsRef = useRef(null);
  useEffect(() => {
    const box = chipsRef.current, on = box && box.querySelector(".chip.on");
    if (on) box.scrollTo({ left: on.offsetLeft - box.clientWidth / 2 + on.clientWidth / 2, behavior: "smooth" });
  }, [month, scope, kind]);
  const people = new Set(list.map((e) => e.name)).size;
  const total = list.reduce((s, e) => s + ((isP ? e.prayers : e.items) || []).length, 0);

  if (data.status === "denied") return html`<div class="wrap"><div class="notice">${isP ? "기도제목" : "감사일기"} 저장 공간이 아직 열려 있지 않아요. 관리자에게 알려주세요.</div></div>`;
  const card = (e) => html`<${EntryCard} key=${e.id} kind=${kind} e=${e} me=${me} member=${byName[e.name]} a=${avOf(e.name)} avOf=${avOf} fresh=${e.id === freshId} can=${canEdit(e)}
    onEdit=${() => onEdit(kind, e)} onDelete=${() => onDelete(kind, e)} onToggle=${(i) => onToggle(e, i)} onReact=${() => onReact("prayers", e, "prayedBy")} onEmoji=${onEmoji} />`;

  return html`<main class="wrap">
    <div class="sec"><h1 style="font-size:24px;margin:0">${isP ? "항아리에 담긴 기도" : "우리의 감사"}</h1></div>
    <div class="seg" role="tablist">
      ${[["all", "모든 기록"], ["month", "월별 보기"], ["year", `${year}년 보기`]].map(([v, l]) => html`<button class=${scope === v ? "on" : ""} role="tab" aria-selected=${scope === v} onClick=${() => setScope(v)}>${l}</button>`)}
    </div>
    ${scope === "month" && html`<div class="chips" ref=${chipsRef}>
      ${MONTHS.map((m, i) => html`<button class=${"chip" + (i === month ? " on" : counts[i] ? "" : " zero")} onClick=${() => setMonth(i)}>${m}${counts[i] > 0 && html`<i>${counts[i]}</i>`}</button>`)}
    </div>`}
    <select class="select" value=${who} onChange=${(e) => setWho(e.target.value)} aria-label="이름으로 보기">
      <option value="">우리 공동체 전체</option>
      ${me && html`<option value=${me.name}>나 (${me.name})</option>`}
      ${names.filter((n) => !me || n !== me.name).map((n) => html`<option value=${n}>${n}</option>`)}
    </select>
    ${data.status === "loading" && html`<div class="empty"><span class="big">🌱</span>불러오는 중…</div>`}
    ${data.status === "error" && html`<div class="notice">데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`}
    ${data.status === "ready" && (list.length === 0
      ? html`<div class="empty"><span class="big">${isP ? "🍃" : "🌼"}</span>
          ${who ? `${who}님의 ` : ""}${scope === "month" ? `${year}년 ${MONTHS[month]}에는` : "아직"} ${isP ? "담긴 기도가" : "적힌 감사일기가"} 없어요.<br />
          아래 <b>${isP ? "+ 기도 담기" : "+ 감사 쓰기"}</b>로 마음을 나눠 보세요.</div>`
      : html`
        <p class="summary">${people}명 · ${unit} <b>${total}개</b>${isP ? html` · 응답 <b>${list.reduce((s, e) => s + (e.answered || []).filter(Boolean).length, 0)}개</b>` : ""}</p>
        ${scope === "month" ? list.map(card) : groups.map((g) => html`<h3 class="month-h">${g.label} <small>· ${g.items.length}건</small></h3>${g.items.map(card)}`)}`)}
  </main>`;
}

/* 이모티콘 반응 바 */
function ReactionBar({ kind, coll, e, me, avOf, onEmoji, lead }) {
  const opts = REACTS[kind];
  const [open, setOpen] = useState(false);
  const rows = opts.map(([k, emo, label]) => ({ k, emo, label, who: reactorsOf(e, k) }));
  const all = [...new Set(rows.flatMap((r) => r.who))];
  const tap = (r) => { setOpen(false); onEmoji(coll, e, r.k, r.emo); };
  return html`<div class="react">
    <div class="rbar">
      ${lead}
      ${rows.filter((r) => r.who.length).map((r) => html`<button class=${"rchip" + (me && r.who.includes(me.name) ? " on" : "")} onClick=${() => tap(r)} aria-label=${r.label}>${r.emo} ${r.who.length}</button>`)}
      <button class="radd" onClick=${() => setOpen(!open)} aria-expanded=${open} aria-label="반응 남기기">${open ? "✕" : "😊＋"}</button>
    </div>
    ${open && html`<div class="rpick">${rows.map((r) => html`<button class=${me && r.who.includes(me.name) ? "on" : ""} onClick=${() => tap(r)}>${r.emo}<small>${r.label}</small></button>`)}</div>`}
    ${all.length > 0 && html`<div class="rsum"><div class="faces">${all.slice(0, 5).map((n) => html`<${Av} a=${avOf(n)} name=${n} crop="face" />`)}</div>
      <span>${all[0]}님${all.length > 1 ? ` 외 ${all.length - 1}명이` : "이"} 반응했어요</span></div>`}
  </div>`;
}

/* 감사 한 줄에 맞는 말씀 한 구절 */
function VerseRec({ items, seed }) {
  const [shift, setShift] = useState(0);
  const r = useMemo(() => recommendVerse(items, seed, shift), [items.join("|"), seed, shift]);
  if (!r.text) return null;
  return html`<div class="vbox">
    <div class="vr-key">📖 이 감사에 드리는 말씀</div>
    <div class="vq"><p>${r.text}</p><cite>${refName(r.ref)} · 개역개정</cite></div>
    <p class="vnote">${r.topic.why}</p>
    ${r.total > 1 && html`<button class="vmore" onClick=${() => setShift(shift + 1)}>↻ 같은 주제의 다른 말씀</button>`}
  </div>`;
}

function EntryCard({ kind, e, me, member, a, avOf, fresh, can, onEdit, onDelete, onToggle, onReact, onEmoji }) {
  const isP = kind === "prayer";
  const items = ((isP ? e.prayers : e.items) || []).map(cleanNum);
  const who = e.prayedBy || [];
  const on = me && who.includes(me.name);
  const [open, setOpen] = useState(!!fresh);
  const ref = useRef(null);
  useEffect(() => { if (!fresh) return; setOpen(true); setTimeout(() => ref.current && ref.current.scrollIntoView({ behavior: "smooth", block: "center" }), 150); }, [fresh]);
  return html`<article ref=${ref} class=${"card" + (isP ? "" : " thanks")}>
    <div class="card-h">
      <${Av} a=${a} name=${e.name} crop="face" />
      <div class="who"><b>${e.name}</b><span>${fmtDate(e.date)}</span></div>
      ${can && html`<button class="mini" onClick=${onEdit}>수정</button><button class="mini del" onClick=${onDelete}>삭제</button>`}
    </div>
    <ul class="plist">
      ${items.map((t, i) => {
        const done = isP && (e.answered || [])[i];
        return html`<li class=${done ? "done" : ""}>
          <span class="num">${isP ? i + 1 : "♡"}</span><span class="txt">${t}</span>
          ${isP && (can
            ? html`<button class=${"ans" + (done ? " on" : "")} onClick=${() => onToggle(i)} aria-pressed=${!!done}>${done ? "✨ 응답" : "응답 표시"}</button>`
            : done && html`<span class="ans on">✨ 응답</span>`)}
        </li>`;
      })}
    </ul>
    ${isP && who.length > 0 && html`<div class="rsum" style="margin-top:8px"><div class="faces">${who.slice(0, 5).map((n) => html`<${Av} a=${avOf(n)} name=${n} crop="face" />`)}</div><span>${who.length}명이 중보하고 있어요</span></div>`}
    <${ReactionBar} kind=${isP ? "prayer" : "thanks"} coll=${isP ? "prayers" : "gratitude"} e=${e} me=${me} avOf=${avOf} onEmoji=${onEmoji}
      lead=${isP ? html`<button class=${"react-btn" + (on ? " on" : "")} onClick=${onReact} aria-pressed=${!!on}>${on ? "함께 기도했어요" : "함께 기도하기"} ${who.length || ""}</button>` : null} />
    ${!isP && html`
      <button class="verse-btn" onClick=${() => setOpen(!open)} aria-expanded=${open}>📖 이 감사에 맞는 말씀 ${open ? "접기 ▴" : "보기 ▾"}</button>
      ${open && html`<${VerseRec} items=${items} seed=${e.id} />`}`}
  </article>`;
}

/* ---------- 쓰기 ---------- */
function EntryForm({ kind, entry, me, avOf, onClose, onSaved }) {
  const isP = kind === "prayer";
  const name = entry ? entry.name : me.name;
  const [date, setDate] = useState(entry ? entry.date : todayStr());
  const [items, setItems] = useState(entry ? ((isP ? entry.prayers : entry.items) || []).map(cleanNum) : [""]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const setAt = (i, v) => setItems(items.map((x, j) => (j === i ? v : x)));
  async function submit() {
    const clean = items.map((t) => cleanNum(t).trim()).filter(Boolean);
    if (!clean.length) return setErr(`${isP ? "기도제목" : "감사한 일"}을 하나 이상 적어 주세요.`);
    if (!date) return setErr("날짜를 골라 주세요.");
    setBusy(true); setErr("");
    const t = nowIso();
    const common = { ...(entry || {}), id: entry ? entry.id : newId(), date, name, createdAt: (entry && entry.createdAt) || t, updatedAt: t };
    let obj;
    if (isP) {
      const old = entry ? (entry.prayers || []).map(cleanNum) : [], oldAns = entry ? entry.answered || [] : [];
      obj = { ...common, prayers: clean, answered: clean.map((p) => { const k = old.indexOf(p); return k >= 0 ? !!oldAns[k] : false; }), prayedBy: entry?.prayedBy || [] };
    } else obj = { ...common, items: clean, amenBy: entry?.amenBy || [] };
    try {
      if (entry) { const latest = await api.get(isP ? "prayers" : "gratitude", entry.id); if (!latest) { setBusy(false); return setErr("이 기록은 이미 삭제됐어요. 닫고 새로 작성해 주세요."); } obj = { ...latest, ...obj, reactions: latest.reactions || {}, ...(isP ? { prayedBy: latest.prayedBy || [] } : { amenBy: latest.amenBy || [] }) }; }
      await api.save(isP ? "prayers" : "gratitude", obj);
      onSaved(date, entry ? "수정했어요" : isP ? "항아리에 기도를 담았어요. 함께 기도할게요!" : "감사일기를 남겼어요. 말씀 선물을 확인해 보세요 🌼", obj.id);
    } catch (e) {
      console.error(e);
      setErr(e && e.code === "permission-denied" ? "저장 권한이 없어요. 관리자에게 알려주세요." : "저장에 실패했어요. 인터넷 연결을 확인해 주세요.");
      setBusy(false);
    }
  }
  return html`<div class="overlay">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grip"></div>
      <div class="sheet-h"><h3>${entry ? `${isP ? "기도제목" : "감사일기"} 수정` : isP ? "항아리에 기도 담기" : "🌼 오늘의 감사일기"}</h3><button class="xbtn" onClick=${onClose} aria-label="닫기">✕</button></div>
      ${entry && html`<div class="editing">✎ ${entry.name}님의 ${isP ? "기도제목을" : "감사일기를"} 수정하는 중이에요</div>`}
      <div class="writer"><${Av} a=${avOf(name)} name=${name} crop="face" /><b>${name}</b><input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} aria-label="날짜" /></div>
      <div class="field">
        <label>${isP ? "함께 기도해 주세요" : "오늘 감사한 일"}</label>
        ${items.map((v, i) => html`<div class="item-row">
          <span class="num">${isP ? i + 1 : "♡"}</span>
          <textarea rows="3" aria-label=${(isP ? "기도제목 " : "감사한 일 ") + (i + 1)} value=${v} onInput=${(e) => setAt(i, e.target.value)}
            placeholder=${isP ? (i === 0 ? "지금 마음에 있는 기도를 적어 주세요" : "기도제목 (선택)") : i === 0 ? "오늘 감사했던 일을 적어주세요" : "감사한 일 (선택)"}></textarea>
          ${items.length > 1 && html`<button class="rm" onClick=${() => setItems(items.filter((_, j) => j !== i))} aria-label="이 줄 지우기">✕</button>`}
        </div>`)}
      </div>
      <button class="addline" onClick=${() => setItems([...items, ""])}>＋ 한 줄 더</button>
      ${err && html`<p class="err">${err}</p>`}
      <button class="btn full" onClick=${submit} disabled=${busy}>${busy ? "저장 중…" : entry ? "수정 완료" : isP ? "항아리에 기도 담기" : "감사일기 남기기 🌼"}</button>
    </div>
  </div>`;
}

/* ---------- 일상 공유 ---------- */
const picsOf = (p) => (p.thumbs && p.thumbs.length ? p.thumbs : p.thumb ? [p.thumb] : []);
const fullKey = (p, i) => (i ? `${p.id}_${i}` : p.id);
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "방금 전"; if (s < 3600) return `${Math.floor(s / 60)}분 전`; if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}일 전`;
  const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
function PostPics({ p, onOpen }) {
  const pics = picsOf(p);
  const [cur, setCur] = useState(0);
  const ref = useRef(null);
  if (!pics.length) return null;
  const onScroll = () => { const el = ref.current; if (el) setCur(Math.round(el.scrollLeft / el.clientWidth)); };
  return html`<div class="pics-wrap">
    <div class="pics" ref=${ref} onScroll=${onScroll}>
      ${pics.map((src, i) => html`<button style=${{ backgroundImage: `url(${src})` }} onClick=${() => onOpen(p, i)} aria-label=${`사진 ${i + 1} 크게 보기`}></button>`)}
    </div>
    ${pics.length > 1 && html`<span class="pic-count">${cur + 1} / ${pics.length}</span><div class="dots">${pics.map((_, i) => html`<i class=${i === cur ? "on" : ""}></i>`)}</div>`}
  </div>`;
}
function PhotoTab({ data, who, setWho, names, limit, me, avOf, byName, canEdit, onMore, onOpen, onEdit, onDelete, onEmoji }) {
  const list = useMemo(() => data.items.filter((p) => !who || p.name === who)
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")), [data.items, who]);
  if (data.status === "denied") return html`<div class="wrap"><div class="notice">일상 저장 공간이 아직 열려 있지 않아요. 관리자에게 알려주세요.</div></div>`;
  return html`<div class="wrap">
    <div class="box hello" ><div style="flex:1"><b>📸 우리 공동체 일상</b><p>오늘 있었던 일, 감사했던 순간을 사진 한 장으로 나눠요. 이모티콘으로 마음을 전해 주세요!</p></div></div>
    <select class="select" value=${who} onChange=${(e) => setWho(e.target.value)} aria-label="이름으로 보기">
      <option value="">모든 동기의 일상</option>
      ${names.map((n) => html`<option value=${n}>${n}</option>`)}
    </select>
    ${data.status === "loading" && html`<div class="empty"><span class="big">📸</span>불러오는 중…</div>`}
    ${data.status === "error" && html`<div class="notice">일상을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`}
    ${data.status === "ready" && (list.length === 0
      ? html`<div class="empty"><span class="big">📸</span>아직 올라온 일상이 없어요.<br />아래 <b>＋ 일상 올리기</b>로 첫 이야기를 나눠 보세요.</div>`
      : html`${list.map((p) => { const m = byName[p.name]; return html`<article class="card post" key=${p.id}>
          <div class="card-h">
            <${Av} a=${avOf(p.name)} crop="face" />
            <div class="who"><b>${p.name}</b><span>${ago(p.createdAt)}${p.date && p.date !== todayStr() ? ` · ${fmtDate(p.date)}` : ""}</span></div>
            ${canEdit(p) && html`<button class="mini" onClick=${() => onEdit(p)}>수정</button><button class="mini del" onClick=${() => onDelete(p)}>삭제</button>`}
          </div>
          <${PostPics} p=${p} onOpen=${onOpen} />
          ${p.caption && html`<p class="cap">${p.caption}</p>`}
          <${ReactionBar} kind="daily" coll="photos" e=${p} me=${me} avOf=${avOf} onEmoji=${onEmoji} />
        </article>`; })}
        ${data.items.length >= limit && html`<button class="btn white more" onClick=${onMore}>일상 더 보기</button>`}`)}
  </div>`;
}

function PhotoForm({ entry, me, onClose, onDone }) {
  const [date, setDate] = useState(entry ? entry.date : todayStr());
  const [caption, setCaption] = useState(entry ? entry.caption || "" : "");
  const [picks, setPicks] = useState([]);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const fileRef = useRef(null);
  const name = entry ? entry.name : me.name;
  const MAXP = 5;
  function onFiles(ev) {
    const files = [...ev.target.files].filter((f) => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
    const next = [...picks, ...files.map((f) => ({ file: f, url: URL.createObjectURL(f) }))];
    if (next.length > MAXP) setErr(`한 번에 ${MAXP}장까지 올릴 수 있어요.`);
    setPicks(next.slice(0, MAXP)); ev.target.value = "";
  }
  async function submit() {
    if (!entry && !picks.length && !caption.trim()) return setErr("사진을 고르거나 글을 적어 주세요.");
    setErr("");
    try {
      if (entry) { setBusy("저장 중…"); await api.save("photos", { ...entry, date, caption: caption.trim(), updatedAt: nowIso() }); return onDone("일상을 수정했어요"); }
      const id = newId(), t = nowIso(), thumbs = [];
      let size = 0;
      for (let i = 0; i < picks.length; i++) {
        setBusy(`사진 올리는 중… ${i + 1} / ${picks.length}`);
        const { full, thumb } = await processPhoto(picks[i].file);
        await api.save("photo_full", { id: i ? `${id}_${i}` : id, data: full.data });
        size += thumb.data.length;
        thumbs.push(size > 820000 ? (await processPhoto(picks[i].file, 360)).thumb.data : thumb.data);
      }
      setBusy("올리는 중…");
      await api.save("photos", { id, date, name, caption: caption.trim(), thumbs, thumb: thumbs[0] || "", reactions: {}, createdAt: t, updatedAt: t });
      onDone(picks.length ? `일상을 공유했어요 📸` : "일상을 공유했어요 ✍️");
    } catch (e) {
      console.error(e);
      setErr(e && e.code === "permission-denied" ? "저장 권한이 없어요. 관리자에게 알려주세요." : /이미지/.test(e && e.message) ? "이 사진 형식은 읽을 수 없어요. 다른 사진으로 시도해 주세요." : "업로드에 실패했어요. 잠시 후 다시 시도해 주세요.");
      setBusy("");
    }
  }
  return html`<div class="overlay">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grip"></div>
      <div class="sheet-h"><h3>${entry ? "일상 수정" : "📸 일상 올리기"}</h3><button class="xbtn" onClick=${onClose} aria-label="닫기" disabled=${!!busy}>✕</button></div>
      ${entry ? (picsOf(entry).length > 0 && html`<div class="picks">${picsOf(entry).map((s) => html`<div style=${{ backgroundImage: `url(${s})` }}></div>`)}</div>`)
        : html`<input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${onFiles} />
          <button class="pickbtn" onClick=${() => fileRef.current && fileRef.current.click()}><span style="font-size:28px">📷</span>사진 고르기 / 찍기<small>최대 ${MAXP}장 · 사진 없이 글만 올려도 돼요</small></button>
          ${picks.length > 0 && html`<div class="picks">${picks.map((p, i) => html`<div style=${{ backgroundImage: `url(${p.url})` }}><button onClick=${() => setPicks(picks.filter((_, j) => j !== i))} aria-label="이 사진 빼기">✕</button></div>`)}</div>`}`}
      <div class="field"><label>오늘 어떤 하루였나요?</label><textarea rows="3" value=${caption} onInput=${(e) => setCaption(e.target.value)} placeholder="예) 청년부 수련회 다녀왔어요! 날씨가 너무 좋았어요 ☀️"></textarea></div>
      <div class="field"><label>날짜</label><input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /></div>
      ${err && html`<p class="err">${err}</p>`}
      <button class="btn full" onClick=${submit} disabled=${!!busy}>${busy || (entry ? "수정 완료" : "공유하기")}</button>
    </div>
  </div>`;
}

function Lightbox({ p, start = 0, can, onClose, onEdit, onDelete }) {
  const pics = picsOf(p);
  const [i, setI] = useState(Math.min(start, Math.max(0, pics.length - 1)));
  const [full, setFull] = useState({});
  useEffect(() => {
    let alive = true; const k = fullKey(p, i);
    if (!full[k]) api.get("photo_full", k).then((d) => { if (alive && d) setFull((f) => ({ ...f, [k]: d.data })); }).catch(() => {});
    return () => { alive = false; };
  }, [p.id, i]);
  return html`<div class="lightbox" role="dialog" aria-modal="true">
    <div class="lb-top">
      <button class="xbtn" onClick=${onClose} aria-label="닫기">✕</button>
      ${pics.length > 1 && html`<span style="font-weight:900">${i + 1} / ${pics.length}</span>`}
      ${can ? html`<div><button class="lb-btn" onClick=${onEdit}>수정</button><button class="lb-btn del" onClick=${onDelete}>삭제</button></div>` : html`<span></span>`}
    </div>
    <div class="lb-img">
      ${pics.length > 1 && html`<button class="lb-nav" style="left:8px" onClick=${() => setI((i - 1 + pics.length) % pics.length)} aria-label="이전 사진">‹</button>`}
      <img src=${full[fullKey(p, i)] || pics[i]} alt=${p.caption || "일상 사진"} />
      ${pics.length > 1 && html`<button class="lb-nav" style="right:8px" onClick=${() => setI((i + 1) % pics.length)} aria-label="다음 사진">›</button>`}
    </div>
    <div class="lb-info"><small>${p.name} · ${fmtDate(p.date)}</small>${p.caption}</div>
  </div>`;
}

/* ---------- 동기 카드 도감 ---------- */
function PeopleTab({names,members,byName,stats,me,onOpen,onEnter,onEnterName}) {
  const [query,setQuery]=useState("");
  const list=names.filter(n=>!query||n.includes(query.trim()));
  return html`<main class="wrap people-page"><div class="section-heading"><h1>우리 동기들</h1>${!me&&html`<button class="text-link" onClick=${onEnter}>내 이름 등록</button>`}</div>
    <p class="page-description">친구의 캐릭터를 누르면 기도를 볼 수 있어요.</p>
    <label class="people-search"><${Icon} name="search" /><input value=${query} onInput=${e=>setQuery(e.target.value)} placeholder="이름으로 찾기" aria-label="동기 이름으로 찾기" /></label>
    <div class="people-grid">${list.map(n=>html`<${TCard} key=${n} name=${n} member=${byName[n]} stat=${stats[n]} mine=${me&&me.name===n} onClick=${()=>onOpen(n)} />`)}</div>
    ${!list.length&&html`<p class="empty">찾는 이름이 없어요. 다른 이름으로 검색해 주세요.</p>`}
  </main>`;
}


/* ---------- 삭제 확인창 ---------- */
function Confirm({ c, onClose }) {
  const [busy, setBusy] = useState(false);
  return html`<div class="overlay center" onClick=${(e) => { if (e.target === e.currentTarget && !busy) onClose(); }}>
    <div class="dialog" role="alertdialog" aria-modal="true">
      <div class="ic">🍂</div><h4>${c.title}</h4><p>${c.body}</p>
      <div class="btns">
        <button class="btn white" onClick=${onClose} disabled=${busy}>취소</button>
        <button class="btn danger" disabled=${busy} onClick=${async () => { setBusy(true); try { await c.onOk(); } finally { onClose(); } }}>${busy ? "삭제 중…" : "삭제"}</button>
      </div>
    </div>
  </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
</script>
